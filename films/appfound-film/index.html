<script>
// Appfound explainer film: one continuous shot. Users (dots) run along the funnel laid out as a track:
// Ad > Store > Onboarding > Paywall > Paying (a row in 16:9 and 1:1, a vertical stack in 9:16).
// Leaks first, then Appfound's six services snap onto the stage each one fixes, then the 90-day process,

// Contract (motion-reel): render.cjs injects window.TL / Motion / FONTS; URL ?size=WxH; pure draw(t); renderFrame(i).

const Q = new URLSearchParams(location.search);

const cv = document.getElementById('c'); cv.width = W; cv.height = H;

const layer = document.createElement('canvas'); layer.width = W; layer.height = H; const lg = layer.getContext('2d');

// ---------------------------------------------------------------- layout: a function of the format
const FMT = W / H > 1.3 ? 'L' : W / H < .8 ? 'V' : 'S';
const VERT = FMT === 'V', RM = !!TL.reduced;                       // RM: reduced-motion cut (variant 'reduced'): no camera push, no slams, no pulses

const SC = i => { const r = G.R(i); return { x: r.x + r.w / 2, y: r.y + r.h / 2 }; };

const PATH = (() => { const pts = [{ x: -40 * U, y: STREAM_Y }, ...[0, 1, 2, 3, 4].map(PA)]; const d = [0]; for (let i = 1; i < pts.length; i++) d.push(d[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y)); return { pts, d }; })();

// ---------------------------------------------------------------- type
const FAM = { disp: 'Archivo', sans: 'Archivo', serif: 'Instrument Serif', mono: 'Plex Mono' };
function font(fam, size, w = 400, ls = null) {

}

function txt(s, x, y, fam, size, color, { w = 400, align = 'left', base = 'middle', ls = null } = {}) {

}
const fit = (strs, fam, start, maxW, w = 400, floor = 22) => { let s = start; while (s > floor * U && Math.max(...strs.map(x => tw(x, fam, s, w))) > maxW) s *= .97; return s; };

// ---------------------------------------------------------------- drawing helpers
const ease = E.inOutCubic;
function rrect(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); }

  const ar = new Path2D('M0 0 L0 22 L6 16.5 L10.5 26 L14 24.5 L9.6 15.4 L17 15.4 Z'); g.fill(ar); g.stroke(ar); g.restore();

// the brand mark: lime tile with the blue up-right arrow (site logo: 32 px tile, r 9, stroke 3.4 on a 32 grid)

const IM = {}; window.MISSING = [];
const load = (k, src) => new Promise(r => { const im = new Image(); im.onload = () => { IM[k] = im; r(); }; im.onerror = () => { window.MISSING.push(`image ${k}: ${src}`); r(); }; im.src = src; });

  const S = C.services[5], c = aiCard(), t0 = svcT(5), s = (VERT ? 30 : 27) * U;
  withLayer(clamp(V.p * 2) * (1 - V.o), 10 * U * V.o, () => {
    g.translate(0, (1 - V.p) * 20 * U);
    const qn = Math.round(S.prompt.length * clamp((t - t0 - .1) / .8)), qtxt = S.prompt.slice(0, qn);
    const qw = Math.min(c.w * .92, tw(S.prompt, 'sans', s, 500) + 44 * U), qLines = wrap(S.prompt, 'sans', s, 500, qw - 44 * U), qh = qLines.length * s * 1.3 + 30 * U;
    const qx = c.x + c.w - qw, qy = c.y;

    let left = qtxt; qLines.forEach((ln, k) => { const part = left.slice(0, ln.length); left = left.slice(ln.length + 1); txt(part, qx + 22 * U, qy + 15 * U + s * .65 + k * s * 1.3, 'sans', s, '#fff', { w: 500 }); });
    const ap = spring(t - t0 - 1.05, 240, 22); if (ap < .01) return;
    const [nm, rest] = S.answer.split(':'), aw = tw(S.answer, 'sans', s, 500) + 50 * U, ah = s * 1.3 + 30 * U, ax = c.x, ay = qy + qh + 16 * U;
    g.save(); g.globalAlpha *= clamp(ap * 2); g.translate(0, (1 - ap) * 14 * U);
    g.fillStyle = P.paper; rrect(ax, ay, Math.min(aw, c.w), ah, 20 * U); g.fill();
    const nw = tw(nm + ':', 'sans', s, 700);
    g.fillStyle = P.lime; g.fillRect(ax + 18 * U, ay + ah / 2 - s * .64, nw + 8 * U, s * 1.28);
    txt(nm + ':', ax + 22 * U, ay + ah / 2 + 1 * U, 'sans', s, P.ink, { w: 700 });

}
function serviceHeader(t) {
  block(t, A.leverLine, A.leverLineOut, () => {                       // Every lever between the ad / and the payment.
    const s = fit(C.leverLine, 'sans', (VERT ? 64 : 80) * U, BOX.w * .94, 500);
    txt(C.leverLine[0], CX, HEAD.cy - s * .48, 'sans', s, '#fff', { w: 500, align: 'center' });
    txt(C.leverLine[1], CX, HEAD.cy + s * .68, 'serif', s * 1.2, P.lime, { align: 'center' });
  });
  if (t < A.phases[0] || t >= A.systemOut + .35) return;
  const o = outP(t, A.systemOut, .3);

  const names = [...C.services.map(s => s.name.toUpperCase()), C.turn[0].toUpperCase()];
  const ns = Math.min(150 * U, HEAD.h * (VERT ? .36 : .4));
  const nameLines = names.map(n => tw(n, 'disp', ns, 800) > BOX.w ? [n.split(' ').slice(0, 2).join(' '), n.split(' ').slice(2).join(' ')] : [n]);

  const es = fit(C.phases, 'mono', (VERT ? 26 : 24) * U, BOX.w, 600);

  const ey = top + es * .6, ny = top + es * 1.2 + 18 * U + ns * .45, ly = ny + ns * .45 + 22 * U + ls * .65;
  withLayer(1 - o, 12 * U * o, () => {

    roll([...A.phases.map((pt, k) => [pt, C.phases[k]]), [A.turn, '']], t, CX, ey, es * 1.7, (s, x, y, a) => alpha(a, () => txt(s, x, y, 'mono', es, P.lime, { w: 600, align: 'center' })));
    roll([...A.services.map((st, k) => [st, k]), [A.turn, -1]], t, CX, ny, ns * 1.1, (k, x, y, a) => k >= 0 && alpha(a, () => txt(names[k], x, y, 'disp', nsz[k], '#fff', { w: 800, align: 'center' })));
    if (t >= A.turn) { const L = nameLines[6], sz = nsz[6], p = spring(t - A.turn - .05, 300, 22); alpha(clamp((t - A.turn) / .1), () => L.forEach((l, j) => txt(l, CX, ny + (1 - p) * 30 * U + (j - (L.length - 1) / 2) * sz * .9 - (L.length - 1) * sz * .45, 'disp', sz, P.lime, { w: 800, align: 'center' }))); }
    roll([...A.services.map((st, k) => [st + .08, C.services[k].line]), [A.turn + .08, C.turn[1]]], t, CX, ly, ls * 1.7, (s, x, y, a) => alpha(a, () => txt(s, x, y, 'sans', ls, P.onBlue, { w: 500, align: 'center' })));

}
function act2(t) {
  actLogo(t);
  if (t < A.rebuild) return;
  serviceHeader(t);
  const o = clamp((t - A.systemOut) / .3); if (o >= 1) return;
  g.save(); g.globalAlpha = 1 - o;
  drawTrack(t, 2); tracking(t); aso(t); drawUsers(t, 2);
  creative(t); paid(t); seo(t); ai(t);
  g.restore();
}

// ================================================================ ACT 3 · the first 90 days, step by step (44 – 55.5) on paper
function processGeo() {
  const pitch = (FMT === 'S' ? 96 : VERT ? 112 : 128) * U, ph = (FMT === 'S' ? 82 : VERT ? 96 : 108) * U;
  if (FMT === 'L') return { tx: BOX.x, tcy: CY, tw: BOX.w * .42, lx: BOX.x + BOX.w * .5, ly: CY + 150 * U, pitch, ph, win: 3.4 };
  if (VERT) return { tx: BOX.x, tcy: BOX.y + 160 * U, tw: BOX.w, lx: BOX.x + 6 * U, ly: BOX.y + BOX.h * .62, pitch, ph, win: 3.6 };
  return { tx: BOX.x, tcy: BOX.y + 110 * U, tw: BOX.w, lx: BOX.x + BOX.w * .1, ly: BOX.y + BOX.h * .66, pitch, ph, win: 2.4 };
}
function pillGeo(k) {
  const G3 = processGeo(), [when, name, time] = C.steps[k];
  const ns = (VERT ? 36 : FMT === 'L' ? 38 : 32) * U, ws = (VERT ? 24 : FMT === 'L' ? 25 : 22) * U, tile = G3.ph - 24 * U;
  const tW = Math.max(tw(name, 'sans', ns, 600), tw(when, 'mono', ws, 600)), base = 12 * U + tile + 20 * U + tW + 34 * U, x = G3.lx + (hash(k, 2) - .5) * 40 * U * (FMT === 'L' ? 1 : .4);
  const room = BOX.x + BOX.w - x - base - 46 * U, tsz = Math.max(19, Math.min(ws * 1.1, fit([time, C.yourTime], 'mono', ws * 1.1, room, 600, 17)));
  const timeW = Math.max(tw(C.yourTime, 'mono', tsz, 600), tw(time, 'mono', tsz, 600));
  return { G3, when, name, time, ns, ws, tile, base, timeW, tsz, x };
}
function act3(t) {
  const G3 = processGeo();
  const TT = FMT === 'L' ? C.processTitleL : C.processTitle, GT = FMT === 'L' ? C.guaranteeL : C.guarantee;
  const titleS = Math.min(fit(TT, 'disp', 190 * U, G3.tw, 800), (FMT === 'L' ? 190 : 120) * U);
  block(t, A.title, A.guarantee, () => TT.forEach((l, k) => txt(l, G3.tx, G3.tcy + (k - (TT.length - 1) / 2) * titleS * .92, 'disp', titleS, P.blue, { w: 800 })));
  block(t, A.guarantee + .1, A.processOut, () => {                     // the guarantee, set as big as the title it replaces
    const gs = Math.min(fit(GT, 'disp', 190 * U, G3.tw, 800), titleS), s2 = (VERT ? 50 : 46) * U;
    const top = Math.max(BOX.y + 40 * U, G3.tcy - (GT.length * gs * .92 + 40 * U + s2) / 2);
    txt(C.guaranteeTag, G3.tx, top - 16 * U, 'mono', 24 * U, P.blue, { w: 600 });
    GT.forEach((l, k) => txt(l, G3.tx, top + gs * .46 + k * gs * .92, 'disp', gs, P.blue, { w: 800 }));
    txt(C.guarantee2, G3.tx, top + GT.length * gs * .92 + 20 * U + s2 * .5, 'serif', s2 * 1.15, P.ink);
  });
  // the list: one pill per step, scrolling up like a feed; the active one is blue and shows your time
  const S = A.steps, active = Math.max(0, S.filter(s => t >= s).length - 1);
  const scroll = track(t, [[0, 0], ...S.map((s, k) => [s, k])], 200, 24);
  const o = outP(t, A.processOut - .05, .3);
  withLayer(1 - o * .999, 8 * U * o, () => {
    for (let k = 0; k < S.length; k++) {
      if (t < S[k] - .02) continue;
      const pg = pillGeo(k), y = G3.ly + (k - scroll) * G3.pitch, d = Math.abs(k - scroll);
      if (d > G3.win + 1) continue;
      const p = spring(t - S[k], 300, 24);
      const isAct = k === active ? clamp(spring(t - S[k] - .05, 260, 24)) : k === active - 1 ? 1 - clamp(spring(t - S[active], 260, 24)) : 0;
      const w = pg.base + (pg.timeW + 40 * U) * isAct, h = G3.ph, last = k === S.length - 1;
      g.save(); g.globalAlpha = clamp(p * 3) * (1 - clamp(d - G3.win + 1)); g.translate(pg.x, y + (1 - p) * 30 * U);
      g.shadowColor = 'rgba(14,12,43,.18)'; g.shadowBlur = 24 * U; g.shadowOffsetY = 8 * U;
      g.fillStyle = mixOklab(P.paper, P.blue, isAct); rrect(0, -h / 2, w, h, h / 2); g.fill();
      g.shadowColor = 'transparent';
      const tileFill = last ? P.lime : isAct > .5 ? P.paper : P.blue, tileInk = last ? P.ink : isAct > .5 ? P.blue : '#fff';
      g.fillStyle = tileFill; rrect(12 * U, -pg.tile / 2, pg.tile, pg.tile, pg.tile / 2); g.fill();
      txt(String(k), 12 * U + pg.tile / 2, 1 * U, 'mono', (VERT ? 30 : 28) * U, tileInk, { w: 600, align: 'center' });
      const tx = 12 * U + pg.tile + 20 * U;
      txt(pg.when, tx, -h * .21, 'mono', pg.ws, isAct > .5 ? P.onBlue : P.mute, { w: 600 });
      txt(pg.name, tx, h * .15, 'sans', pg.ns, isAct > .5 ? '#fff' : P.ink, { w: 600 });
      if (isAct > .02) alpha(clamp((isAct - .4) / .6), () => {
        g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(pg.base - 16 * U, -h * .3, 2 * U, h * .6);
        txt(C.yourTime, pg.base + 6 * U, -h * .21, 'mono', Math.min(pg.ws, pg.tsz), P.onBlue, { w: 600 });
        txt(pg.time, pg.base + 6 * U, h * .15, 'mono', pg.tsz, P.lime, { w: 600 });

}
function day90Tile() { const G3 = processGeo(), pg = pillGeo(8); return { x: pg.x + 12 * U + pg.tile / 2, y: G3.ly }; }

// ================================================================ ACT 4 · the operator, the payoff, the call (55.5 – 64) on blue
function act4(t) {
  if (t < A.payoff + .4) {                                              // operator: the day-90 tile becomes his portrait
    const o = outP(t, A.operatorOut - .1, .3), p = spring(t - A.operator, 200, 22);
    const R0 = (FMT === 'L' ? 190 : VERT ? 200 : 150) * U, r = R0 * p;
    const s1 = fit([C.operator[0], C.operator[1]], 'sans', (VERT ? 70 : 76) * U, FMT === 'L' ? BOX.w * .5 : BOX.w, 600), s2 = s1 * 1.12;
    let px, py, lx, ly, al;
    if (FMT === 'L') { const gw = 2 * R0 + 70 * U + Math.max(tw(C.operator[0], 'sans', s1, 600), tw(C.operator[1], 'serif', s2)); px = CX - gw / 2 + R0; py = CY; lx = px + R0 + 70 * U; ly = CY - s1 * .7; al = 'left'; }
    else { px = CX; py = CY - (VERT ? 200 : 170) * U; lx = CX; ly = py + R0 + 80 * U; al = 'center'; }

      if (t < A.operator + .3) dot(lerp(tile.x, px, tp), lerp(tile.y, py, tp), lerp(22 * U, 30 * U, tp), P.lime);
      const RR = Math.max(r, 30 * U * (1 - clamp(p * 3)));

        g.save(); g.beginPath(); g.arc(px, py, RR, 0, Math.PI * 2); g.clip(); g.drawImage(IM.portrait, 110, 40, 460, 460, px - RR, py - RR, 2 * RR, 2 * RR); g.restore();
        ring(px, py, RR + 7 * U, P.lime, 5 * U, clamp(p));
      }

      alpha(a1, () => txt(C.operator[0], lx, ly + (1 - a1) * 20 * U, 'sans', s1, '#fff', { w: 600, align: al }));
      alpha(a2, () => txt(C.operator[1], lx, ly + s1 * 1.12 + (1 - a2) * 20 * U, 'serif', s2, P.lime, { align: al }));
      const ws = (VERT ? 28 : 26) * U, w2 = fit([C.who2], 'mono', (VERT ? 22 : 22) * U, FMT === 'L' ? BOX.w * .5 : BOX.w, 600);
      alpha(a3, () => { txt(C.who, lx, ly + s1 * 1.12 + s2 * .9 + 34 * U, 'mono', ws, '#fff', { w: 600, align: al }); txt(C.who2, lx, ly + s1 * 1.12 + s2 * .9 + 34 * U + ws * 1.6, 'mono', w2, P.onBlue, { w: 600, align: al }); });
    });
  }

    const cols = VERT ? ['#fff', P.coral, P.lime] : [null, P.lime];
    const { s, ys } = VERT ? headlineDisplay(lines, CY - 60 * U, BOX.w * .96, 620 * U) : headlineDisplay(lines, HEAD.cy + 10 * U, BOX.w * .94, HEAD.h + 30 * U);
    const o = outP(t, A.endCard, .32);
    withLayer(1 - o, 16 * U * o, () => {
      g.translate(0, -o * 50 * U);
      lines.forEach((l, k) => {
        const tk = k === lines.length - 1 ? A.payoff2 : A.payoff + k * .12; if (t < tk) return;
        const p = spring(t - tk, 320, 24), sc = k === lines.length - 1 && !RM ? 1 + .06 * (1 - p) : 1;
        clipRect(0, ys[k] - s * .56, W, s * 1.12, () => {
          g.save(); g.translate(CX, ys[k] + (1 - p) * s * .85); g.scale(sc, sc);
          if (cols[k]) { if (cols[k] === P.coral) { const wl = tw(l, 'disp', s, 800); inkPlate(-wl / 2, wl, s); } txt(l, 0, 0, 'disp', s, cols[k], { w: 800, align: 'center' }); }
          else { const w1 = tw(C.hook[0] + ' ', 'disp', s, 800), w2 = tw(C.hook[1], 'disp', s, 800), x0 = -(w1 + w2) / 2;   // INSTALLS (white) DON'T PAY. (coral), as in the hook
            txt(C.hook[0] + ' ', x0, 0, 'disp', s, '#fff', { w: 800 }); inkPlate(x0 + w1, w2, s); txt(C.hook[1], x0 + w1, 0, 'disp', s, P.coral, { w: 800 }); }

}
function inkPlate(x, w, s) { g.fillStyle = P.ink; rrect(x - s * .1, -s * .5, w + s * .2, s * 1.0, s * .08); g.fill(); }
function endCard(t) {
  const sc = FMT === 'L' ? 1.45 : VERT ? 1.35 : 1.2, lockY = CY - (VERT ? 230 : FMT === 'L' ? 150 : 150) * U;
  const s = LOGO.s * sc, ws = LOGO.ws * sc, gap = LOGO.gap * sc, wW = wordW(sc), tileX = CX - (s + gap + wW) / 2 + s / 2;
  const lp = spring(t - A.endCard, 220, 22), rev = ease(clamp((t - A.endCard - .1) / .5));
  const press = spring(t - A.click, 600, 30) - spring(t - A.click - .12, 400, 28);
  // after the click, a lime dot leaves the button and lands in the mark: the tile answers with a pulse
  const fly = clamp((t - A.click - .1) / .55), land = spring(t - A.click - .65, 300, 14) - spring(t - A.click - .8, 300, 20);
  g.save(); g.globalAlpha = clamp(lp * 2); g.translate(CX, lockY); g.scale(.92 + .08 * lp, .92 + .08 * lp); g.translate(-CX, -lockY);
  const tileShift = (1 - rev) * (gap + wW) / 2;
  g.save(); g.translate(tileX + tileShift, lockY); g.scale(1 + .08 * land, 1 + .08 * land); mark(0, 0, s, clamp((t - A.endCard) / .45)); g.restore();
  clipRect(tileX + s / 2 + gap * .4, lockY - ws, (gap + wW) * rev + 10 * U, ws * 2, () => txt(C.wordmark, tileX + s / 2 + gap, lockY + ws * .04, 'serif', ws, '#fff'));
  g.restore();
  const bs = (FMT === 'L' ? 44 : VERT ? 42 : 40) * U, bw = tw(C.cta, 'sans', bs, 600) + 80 * U, bh = bs * 2.3, by = lockY + s / 2 + 80 * U + bh / 2;
  const cp = spring(t - A.cta, 260, 20);
  if (cp > .01) {
    g.save(); g.globalAlpha = clamp(cp * 3); g.translate(CX, by + (1 - cp) * 20 * U); const k = (.94 + .06 * cp) * (1 - .05 * press); g.scale(k, k);
    g.fillStyle = P.lime; rrect(-bw / 2, -bh / 2, bw, bh, bh / 2); g.fill();
    if (press > .01) { g.fillStyle = `rgba(14,12,43,${.14 * clamp(press)})`; rrect(-bw / 2, -bh / 2, bw, bh, bh / 2); g.fill(); }
    txt(C.cta, 0, 1 * U, 'sans', bs, P.ink, { w: 600, align: 'center' }); g.restore();
  }

  alpha(sp, () => txt(C.ctaSub, CX, by + bh / 2 + 50 * U, 'mono', (VERT ? 28 : 28) * U, P.onBlue, { w: 600, align: 'center' }));
  alpha(up, () => txt(C.url, CX, by + bh / 2 + 110 * U, 'mono', (VERT ? 34 : 34) * U, '#fff', { w: 600, align: 'center' }));
  if (fly > 0 && fly < 1) { const e = ease(fly), fx = lerp(CX + bw * .22, tileX, e), fy = lerp(by, lockY, e) - Math.sin(e * Math.PI) * 120 * U; dot(fx, fy, 14 * U, P.lime); }
  const ca = clamp((t - A.cursorIn) / .2) * (1 - clamp((t - A.click - 1.2) / .4));
  if (ca > 0) {
    const sx = CX + 520 * U, sy = by + 320 * U, ex = CX + bw * .22, ey = by + bh * .12;
    const kx = track(t, [[0, sx], [A.cursorIn + .05, ex], [A.click + .9, ex + 160 * U]], 110, 20), ky = track(t, [[0, sy], [A.cursorIn + .05, ey], [A.click + .9, ey + 200 * U]], 110, 20);
    g.save(); g.globalAlpha = ca; cursor(kx, ky, 2 * U * (1 - .12 * press)); g.restore();
  }
}

// ================================================================ draw(t): the only entry point
function irisR(t, t0, c, r0) { const far = Math.max(Math.hypot(c.x, c.y), Math.hypot(W - c.x, c.y), Math.hypot(c.x, H - c.y), Math.hypot(W - c.x, H - c.y)); return lerp(r0, far + 10, ease(clamp((t - t0) / .7))); }
function draw(T) {
  const t = Math.min(T, DUR - 1e-4);
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.filter = 'none';
  const pc = SC(4);
  if (t < A.iris + .7) { ground('ink'); act1(t); }
  if (t >= A.iris && t < A.wipe + .45) {
    g.save(); g.beginPath(); g.arc(pc.x, pc.y, irisR(t, A.iris, pc, 26 * U), 0, Math.PI * 2); g.clip(); ground('blue'); act2(t); g.restore();
  }
  if (t >= A.wipe && t < A.iris2 + .7) {
    const top = H * (1 - ease(clamp((t - A.wipe) / .45)));
    g.save(); g.beginPath(); g.rect(0, top, W, H - top); g.clip(); ground('paper'); act3(t); g.restore();
  }
  if (t >= A.iris2) {
    const c = day90Tile();
    g.save(); g.beginPath(); g.arc(c.x, c.y, irisR(t, A.iris2, c, 22 * U), 0, Math.PI * 2); g.clip(); ground('blue'); act4(t); g.restore();
  }
}
window.draw = window.seek = draw;

// ---------------------------------------------------------------- frame composer: average N subframes (motion blur)
const acc = document.createElement('canvas'); acc.width = W; acc.height = H; const ag = acc.getContext('2d');
window.renderFrame = (i, opts = {}) => {
  const times = subframeTimes(i, { fps: TL.fps || 60, sub: 6, shutter: .75, fast: TL.fast || [], hardCuts: TL.hardCuts || [], dur: DUR, ...opts });
  times.forEach((ts, k) => { draw(ts); ag.globalAlpha = 1 / (k + 1); ag.drawImage(cv, 0, 0); });
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.filter = 'none'; g.drawImage(acc, 0, 0);
};
(async () => {
  for (const f of window.FONTS || []) {
    const ff = new FontFace(f.family, `url(data:font/woff2;base64,${f.b64})`, { weight: f.weight || '400', style: f.style || 'normal', ...(f.stretch ? { stretch: f.stretch } : {}) });
    await ff.load(); document.fonts.add(ff);
  }
  await Promise.all(Object.entries(TL.images || {}).map(([k, src]) => load(k, src)));
  draw(0); window.ready = true;
})();
