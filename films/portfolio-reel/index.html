<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script>
// Portfolio reel (Mohamed Barkat): one continuous shot, one cobalt dot as the recurring character.
// Contract (motion-reel): render.cjs injects window.TL / Motion / FONTS; URL ?size=WxH; pure draw(t); renderFrame(i).
// Rules: no timers, no Math.random, no state between frames. Every time and string comes from timeline.json.
const { clamp, lerp, E, spring, track, mixOklab, hash, subframeTimes } = window.Motion;
const inCubic = x => x * x * x;
const Q = new URLSearchParams(location.search);
const [W, H] = (Q.get('size') || '1920x1080').split('x').map(Number);
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
let g = cv.getContext('2d');
const layer = document.createElement('canvas'); layer.width = W; layer.height = H; const lg = layer.getContext('2d');
const TL = window.TL, A = TL.acts, DUR = TL.duration, P = TL.palette, C = TL.copy[Q.get('lang') || 'en'];

// ---------------------------------------------------------------- layout: a function of the format
const FMT = W / H < .9 ? 'portrait' : 'landscape';
const U = Math.min(W, H) / 1080 * (FMT === 'portrait' ? 1.2 : 1);   // a phone shows 9:16 full screen: type can grow
const SF = FMT === 'portrait' ? { l: .08, r: .12, t: .12, b: .18 } : { l: .07, r: .07, t: .09, b: .09 };
window.SAFEBOX = { x0: W * SF.l, y0: H * SF.t, x1: W * (1 - SF.r), y1: H * (1 - SF.b) };
const BOX = { x: W * SF.l, y: H * SF.t, w: W * (1 - SF.l - SF.r), h: H * (1 - SF.t - SF.b) };
const CX = BOX.x + BOX.w / 2, CY = BOX.y + BOX.h / 2;

// ---------------------------------------------------------------- type
const FAM = { sans: 'Archivo', serif: 'Instrument Serif', mono: 'Plex Mono', arabic: 'Plex Arabic' };
function font(fam, size, w = 700, it = false, ls = null) {
  g.font = `${it ? 'italic ' : ''}${w} ${size}px "${FAM[fam]}", sans-serif`;
  g.letterSpacing = `${(ls ?? (fam === 'mono' ? .14 : fam === 'sans' && size > 60 * U ? -.03 : -.01)) * size}px`;
}
function tw(s, fam, size, w, it, ls) { font(fam, size, w, it, ls); const m = g.measureText(s), r = Math.max(m.width, m.actualBoundingBoxRight || 0); g.letterSpacing = '0px'; return r; }
function txt(s, x, y, fam, size, color, { w = 700, it = false, align = 'left', base = 'middle', ls = null } = {}) {
  font(fam, size, w, it, ls); g.textAlign = align; g.textBaseline = base; g.fillStyle = color; g.fillText(s, x, y); g.letterSpacing = '0px';
}
// largest size <= start at which every string fits maxW
const fit = (strs, fam, start, maxW, w = 700, it = false) => { let s = start; while (s > 22 * U && Math.max(...strs.map(x => tw(x, fam, s, w, it))) > maxW) s *= .96; return s; };

// ---------------------------------------------------------------- drawing helpers
function rrect(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); }
function dot(x, y, r, color, a = 1) { if (r <= .05 || a <= 0) return; g.save(); g.globalAlpha *= a; g.fillStyle = color; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); g.restore(); }
function clipRect(x, y, w, h, fn) { g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip(); fn(); g.restore(); }
// draw fn() on the layer, then composite with alpha + one blur (ctx.filter per call is ~100x slower). Don't nest.
function withLayer(a, blur, fn) {
  if (a <= 0) return;
  if (blur < .3 && a >= .999) { g.save(); fn(); g.restore(); return; }
  const main = g; lg.setTransform(1, 0, 0, 1, 0, 0); lg.clearRect(0, 0, W, H); lg.globalAlpha = 1; lg.filter = 'none';
  g = lg; g.save(); fn(); g.restore(); g = main;
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = a; g.filter = blur >= .3 ? `blur(${blur.toFixed(1)}px)` : 'none'; g.drawImage(layer, 0, 0); g.restore();
}
function vignette(dark) {
  const v = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.hypot(W, H) * .62);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, dark ? 'rgba(0,0,0,.5)' : 'rgba(12,13,16,.07)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}
// a word that rolls into a masked line: enters from below, the previous one leaves upward
function roll(items, t, x, y, size, drawItem, lh = 1.25) {
  let i = -1; for (let k = 0; k < items.length; k++) if (t >= items[k][0]) i = k;
  clipRect(0, y - size * lh / 2, W, size * lh, () => {
    if (i >= 1) { const p = spring(t - items[i][0], 320, 28); if (p < .999) drawItem(items[i - 1], x, y - p * size * lh, 1 - p); }
    if (i >= 0) { const p = spring(t - items[i][0], 320, 28); drawItem(items[i], x, y + (1 - p) * size * lh, clamp((t - items[i][0]) / .06)); }
  });
  return i;
}
const IM = {}; window.MISSING = [];
const load = (k, src) => new Promise(r => { const im = new Image(); im.onload = () => { IM[k] = im; r(); }; im.onerror = () => { window.MISSING.push(`image ${k}: ${src}`); r(); }; im.src = src; });

// ================================================================ ACT 1 · greet → portrait → name (0 – 4.0)
const GREET = TL.greetings;                                         // [[t, word, script?], ...]
function act1(t) {
  const kf = Math.min(1, BOX.w * .94 / (104 * U + 22 * U * 80 / 58 + tw(C.first + ' ' + C.last, 'sans', 80 * U, 700)));   // the full name fits the safe box
  const base = 58 * U * kf, size = track(t, [[0, base], [A.fullName, 80 * U * kf]], 220, 24);
  const r = track(t, [[0, 8 * U], [A.avatar, 40 * U * kf], [A.fullName, 52 * U * kf], [A.shrink, 8 * U]], 200, 21) * spring(t - .02, 260, 17);
  const gap = 22 * U * size / base;
  // the word slot: greetings, then the name; its width springs so the group recentres smoothly
  const gw = s => s[2] === 'arabic' ? tw(s[1], 'arabic', base * 1.05, 600) : tw(s[1], 'sans', base, 600);
  const wKeys = [[0, 0], ...GREET.map(s => [s[0], gw(s)]), [A.avatar, tw(C.first, 'sans', base, 700)]];
  const rev = spring(t - A.fullName - .05, 240, 24);
  const wFirst = tw(C.first, 'sans', size, 700), wLast = tw(' ' + C.last, 'sans', size, 700);
  let wordW = t < A.fullName ? track(t, wKeys, 300, 28) : wFirst + rev * wLast;
  const out = spring(t - A.shrink, 260, 26); wordW *= 1 - out;
  const imV = clamp(spring(t - A.im, 260, 24) - spring(t - A.fullName, 260, 24));
  const imW = (tw(C.im, 'sans', base, 600) + 14 * U) * imV;
  const showWord = t >= GREET[0][0];
  const total = imW + 2 * r + (showWord ? gap * (1 - out) + wordW : 0);
  const left = CX - total / 2, dx = left + imW + r, wx = dx + r + gap;

  if (imV > .01) txt(C.im, left + imW - 14 * U - tw(C.im, 'sans', base, 600), CY, 'sans', base, P.onDark, { w: 600 });
  // dot → portrait (the portrait shows once the dot is big enough to read as a face)
  dot(dx, CY, r, P.signalOnDark);
  const pa = clamp((r - 16 * U) / (14 * U));
  if (IM.portrait && pa > 0) {
    g.save(); g.globalAlpha = pa; g.beginPath(); g.arc(dx, CY, r, 0, Math.PI * 2); g.clip();
    g.drawImage(IM.portrait, 95, 105, 430, 430, dx - r, CY - r, 2 * r, 2 * r); g.restore();
  }
  if (!showWord) return;
  // greeting roll + name, blurred out at the shrink
  const items = [...GREET, [A.avatar, C.first, 'name']];
  withLayer(1 - clamp((t - A.shrink) / .22), 14 * U * clamp((t - A.shrink) / .22), () => {
    roll(items, t, wx, CY, base, (it, x, y, a) => {
      g.save(); g.globalAlpha *= a;
      if (it[2] === 'arabic') txt(it[1], x, y, 'arabic', base * 1.05, P.onDark, { w: 600 });
      else if (it[2] === 'name') {
        txt(C.first, x, y, 'sans', size, P.onDark, { w: 700 });
        if (rev > .001) clipRect(x + wFirst, y - size, wLast * rev, size * 2, () => txt(' ' + C.last, x + wFirst, y, 'sans', size, P.onDark, { w: 700 }));
      } else txt(it[1], x, y, 'sans', base, P.onDark, { w: 600 });
      g.restore();
    });
    // position: role, then the segments served (both held to the shrink)
    const ra = spring(t - A.role1, 240, 24), sa = spring(t - A.segments, 240, 24);
    if (ra > .01) { g.save(); g.globalAlpha = clamp(ra); txt(C.role1, wx, CY + size * .72 + (1 - ra) * 12 * U, 'sans', 34 * U, P.onDark, { w: 500 }); g.restore(); }
    if (sa > .01) { g.save(); g.globalAlpha = clamp(sa); txt(C.segments, wx, CY + size * .72 + 50 * U + (1 - sa) * 12 * U, 'mono', 24 * U, P.signalOnDark, { w: 500 }); g.restore(); }
  });
}

// ================================================================ ACT 2 · THE SYSTEM — Six levers. One owner. (4.5 – 7.0)
function act2(t) {
  const words = C.words, n = words.length, last = n - 1;
  const Ws = fit(words.map((w, k) => k === last ? w + '..' : w), 'sans', 150 * U, BOX.w * .82, 800);
  const fams = words.map((_, k) => k === last ? ['serif', Ws * 1.16, 400, true, P.signalOnDark] : ['sans', Ws, 800, false, P.onDark]);
  const widths = words.map((w, k) => tw(w, fams[k][0], fams[k][1], fams[k][2], fams[k][3]));
  const blockW = Math.max(...widths) + Ws * .2, BL = CX - blockW / 2;
  const rows = words.map((_, k) => CY + Ws * .35 + (k - last / 2) * Ws * 1.02), ebSize = 26 * U, ebY = rows[0] - Ws * 1.07;
  const ebW = tw(C.eyebrow, 'mono', ebSize, 500);
  const rP = Ws * .072, per = k => [BL + widths[k] + Ws * .03 + rP, rows[k] - rP * 1.05];
  const T = words.map((_, k) => A['word' + (k + 1)]), dirs = words.map((_, k) => k % 2 ? 1 : -1);
  const exitP = clamp((t - A.taglineOut) / .2);

  // the dot: centre → eyebrow start → along the eyebrow (typing it) → full stop of each word → back to centre
  const tA = A.tagline, tE0 = tA + .12, tE1 = A.word1 - .05;
  let x, y;
  if (t < tE0) { const p = spring(t - tA, 300, 26); x = lerp(CX, BL - 16 * U, p); y = lerp(CY, ebY, p); }
  else if (t < tE1) { x = BL - 16 * U + (ebW + 32 * U) * E.inOutCubic((t - tE0) / (tE1 - tE0)); y = ebY; }
  else {
    const kx = [[tE1, BL + ebW + 16 * U], ...T.map((tt, k) => [tt + .06, per(k)[0]]), [A.taglineOut + .05, CX]];
    const ky = [[tE1, ebY], ...T.map((tt, k) => [tt + .06, per(k)[1]]), [A.taglineOut + .05, CY]];
    x = track(t, kx, 260, 25); y = track(t, ky, 260, 25);
  }
  const rd = track(t, [[tA, 7 * U], [A.word1 + .06, rP], [A.taglineOut + .05, 7 * U]], 260, 25);

  withLayer(1 - exitP, 16 * U * exitP, () => {
    const n = Math.round(C.eyebrow.length * clamp((t - tE0) / (tE1 - tE0)));
    if (n > 0) txt(C.eyebrow.slice(0, n), BL, ebY, 'mono', ebSize, P.mutedDark, { w: 500 });
    words.forEach((w, k) => {
      if (t < T[k]) return;
      const p = spring(t - T[k], 210, 23), off = dirs[k] * (1 - p) * Ws * 2.4, a = clamp((t - T[k]) / .05);
      const [fam, sz, wt, it, col] = fams[k];
      for (let s = 5; s >= 1; s--) {                               // speed streak: trailing copies while it travels
        const sa = .16 * (1 - s / 6) * (1 - p) * a; if (sa < .004) continue;
        g.save(); g.globalAlpha = sa; txt(w, BL + off + dirs[k] * s * Ws * .22 * (1 - p), rows[k], fam, sz, col, { w: wt, it, base: 'alphabetic' }); g.restore();
      }
      g.save(); g.globalAlpha = a; txt(w, BL + off, rows[k], fam, sz, col, { w: wt, it, base: 'alphabetic' }); g.restore();
      const leaves = k < last ? T[k + 1] + .06 : A.taglineOut + .05;   // the dot leaves a full stop behind as it moves on
      if (t >= leaves) dot(per(k)[0], per(k)[1], rP, k < last ? P.onDark : P.signalOnDark);
    });
  });
  dot(x, y, rd, P.signalOnDark);
}

// ================================================================ ACT 3 · what I do: six levers, one at a time (7.0 – 22.5)
const LV = C.levers, LT = A.levers;
const lvEnd = k => k + 1 < LT.length ? LT[k + 1] : A.leversOut;
// pop-in progress for item i of a visual: staggered springs that settle from scale .92, never from 0
const pop = (t, t0) => spring(t - t0, 260, 22);
function chip(label, x, y, h, fill, ink, a, sc) {
  const w = tw(label, 'sans', 32 * U, 600) + 52 * U;
  g.save(); g.globalAlpha *= clamp(a); g.translate(x + w / 2, y + h / 2); g.scale(sc, sc);
  g.fillStyle = fill; rrect(-w / 2, -h / 2, w, h, h / 2); g.fill();
  txt(label, 0, 1 * U, 'sans', 32 * U, ink, { w: 600, align: 'center' }); g.restore();
  return w;
}
const VIS = {
  chips(t, L, d, vx, vy, VW) {                                       // Plan: the four outputs of the plan
    const h = 68 * U, gap = 18 * U, ws = d.items.map(it => tw(it, 'sans', 32 * U, 600) + 52 * U), rows = [[]];
    let rw = 0; ws.forEach((w, i) => { if (rw && rw + gap + w > VW) { rows.push([]); rw = 0; } rows[rows.length - 1].push(i); rw += (rw ? gap : 0) + w; });
    rows.forEach((r, ri) => {
      const tot = r.reduce((s2, i) => s2 + ws[i], 0) + gap * (r.length - 1); let x = vx + VW / 2 - tot / 2;
      r.forEach(i => { const p = pop(t, L + .2 + i * .15); chip(d.items[i], x, vy + 30 * U + ri * (h + gap) + (1 - p) * 18 * U, h, i === 0 ? P.signal : P.paper2, i === 0 ? P.paper : P.inkText, p * 4, .92 + .08 * p); x += ws[i] + gap; });
    });
  },
  events(t, L, d, vx, vy, VW) {                                      // Track: events checked in order as the signal passes
    const rh = 70 * U, bw = Math.min(VW, 520 * U), bx = vx + VW / 2 - bw / 2, y0 = vy + 20 * U;
    d.items.forEach((ev, i) => {
      const p = pop(t, L + .12 + i * .08), y = y0 + i * rh, ok = spring(t - (L + .3 + i * .3), 420, 26);
      g.save(); g.globalAlpha = clamp(p * 3); g.translate(0, (1 - p) * 16 * U);
      g.fillStyle = P.paper2; rrect(bx, y, bw, rh - 12 * U, 14 * U); g.fill();
      txt(ev, bx + 26 * U, y + (rh - 12 * U) / 2, 'mono', 30 * U, P.inkText, { w: 500, ls: .02 });
      const cx = bx + bw - 40 * U, cy = y + (rh - 12 * U) / 2;
      g.strokeStyle = P.paper3; g.lineWidth = 2 * U; g.beginPath(); g.arc(cx, cy, 16 * U, 0, Math.PI * 2); g.stroke();
      if (ok > .01) {
        dot(cx, cy, 16 * U * Math.min(1, ok), P.signal);
        g.strokeStyle = P.paper; g.lineWidth = 3.4 * U; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath();
        const q = clamp(ok * 1.4); g.moveTo(cx - 7 * U, cy); g.lineTo(cx - 2 * U, cy + 5 * U * Math.min(1, q * 2)); if (q > .5) g.lineTo(cx - 2 * U + 10 * U * (q - .5) * 2, cy + 5 * U - 11 * U * (q - .5) * 2); g.stroke();
      }
      g.restore();
    });
    const ca = spring(t - L - 1.2, 220, 24);
    if (ca > .01) { g.save(); g.globalAlpha = clamp(ca); txt(d.caption, vx + VW / 2, y0 + 3 * rh + 26 * U, 'mono', 24 * U, P.muted, { w: 500, align: 'center' }); g.restore(); }
  },
  hooks(t, L, d, vx, vy, VW) {                                       // Create: three hooks briefed, one goes live
    const gap = 28 * U, cw = Math.min(230 * U, (VW - 2 * gap) / 3), ch = 150 * U, x0 = vx + VW / 2 - (3 * cw + 2 * gap) / 2, y = vy + 40 * U;
    const live = spring(t - L - 1.1, 240, 22);
    d.items.forEach((h, i) => {
      const p = pop(t, L + .2 + i * .15), x = x0 + i * (cw + gap), on = i === 1 ? clamp(live) : 0;
      g.save(); g.globalAlpha = clamp(p * 3); g.translate(x + cw / 2, y + ch / 2); g.scale(1, .2 + .8 * Math.min(p, 1.04));
      g.fillStyle = mixOklab(P.paper2, P.signal, on); rrect(-cw / 2, -ch / 2, cw, ch, 18 * U); g.fill();
      txt(h, 0, 2 * U, 'sans', 36 * U, mixOklab(P.inkText, P.paper, on), { w: 700, align: 'center' }); g.restore();
      g.save(); g.globalAlpha = clamp(p * 3); txt(d.labels[i], x + cw / 2, y + ch + 34 * U, 'mono', 24 * U, P.muted, { w: 500, align: 'center' }); g.restore();
    });
    if (live > .01) { g.save(); g.globalAlpha = clamp(live); txt(d.tag, x0 + 1.5 * cw + gap, y - 26 * U - (1 - live) * 10 * U, 'mono', 24 * U, P.signal, { w: 500, align: 'center' }); g.restore(); }
  },
  bars(t, L, d, vx, vy, VW) {                                        // Launch: budget follows conversions (illustrative heights)
    const bw = 116 * U, gap = 72 * U, Hm = 210 * U, x0 = vx + VW / 2 - (3 * bw + 2 * gap) / 2, base = vy + 30 * U + Hm;
    const K = [[.62, .62, .62], [.86, .44, .3], [.6, .84, .38]], T0 = [L + .2, L + 1.0, L + 1.6];
    d.items.forEach((nm, i) => {
      const hgt = track(t, [[0, 0], ...T0.map((tt, j) => [tt, K[j][i]])], 200, 22) * Hm, x = x0 + i * (bw + gap);
      g.fillStyle = P.signal; if (hgt > 1) { rrect(x, base - hgt, bw, hgt, 12 * U); g.fill(); }
      txt(nm, x + bw / 2, base + 34 * U, 'sans', 30 * U, P.inkText, { w: 600, align: 'center' });
    });
    g.fillStyle = P.paper3; g.fillRect(x0 - 20 * U, base, 3 * bw + 2 * gap + 40 * U, 2 * U);
    const ca = spring(t - L - 1.0, 220, 24);
    if (ca > .01) { g.save(); g.globalAlpha = clamp(ca); txt(d.caption, vx + VW / 2, base + 92 * U, 'mono', 24 * U, P.muted, { w: 500, align: 'center' }); g.restore(); }
  },
  gap(t, L, d, vx, vy, VW) {                                         // Analyze: platform-reported vs measured, the gap is the decision
    const bwMax = Math.min(VW, 820 * U), bx = vx + VW / 2 - bwMax / 2, bh = 40 * U, y1 = vy + 52 * U, y2 = y1 + 120 * U;
    const p1 = spring(t - L - .25, 160, 21), p2 = spring(t - L - .45, 160, 21), lens = [.95, .6];
    txt(d.items[0], bx, y1 - 28 * U, 'sans', 30 * U, P.muted, { w: 600 }); txt(d.items[1], bx, y2 - 28 * U, 'sans', 30 * U, P.inkText, { w: 600 });
    g.fillStyle = P.paper3; rrect(bx, y1, bwMax * lens[0] * p1, bh, bh / 2); g.fill();
    g.fillStyle = P.signal; rrect(bx, y2, bwMax * lens[1] * p2, bh, bh / 2); g.fill();
    const ga = spring(t - L - 1.0, 220, 24);
    if (ga > .01) {
      g.save(); g.globalAlpha = clamp(ga); g.setLineDash([8 * U, 7 * U]); g.strokeStyle = P.signal; g.lineWidth = 2.5 * U;
      rrect(bx + bwMax * lens[1] + 8 * U, y2, bwMax * (lens[0] - lens[1]) - 8 * U, bh, bh / 2); g.stroke(); g.setLineDash([]);
      txt(d.caption, vx + VW / 2, y2 + bh + 66 * U, 'serif', 44 * U, P.inkText, { w: 400, it: true, align: 'center' }); g.restore();
    }
  },
  rank(t, L, d, vx, vy, VW) {                                        // Get found: your brand climbs to the first result
    const rw = Math.min(VW, 600 * U), rx = vx + VW / 2 - rw / 2, rh = 74 * U, y0 = vy + 20 * U;
    const up = spring(t - L - .8, 190, 21), slot = [track(t, [[0, 0], [L + .8, 1]], 190, 21), track(t, [[0, 1], [L + .8, 2]], 190, 21), track(t, [[0, 2], [L + .8, 0]], 190, 21)];
    for (let r = 0; r < 3; r++) txt(String(r + 1), rx + 28 * U, y0 + r * rh + (rh - 12 * U) / 2, 'mono', 28 * U, P.muted, { w: 500 });
    [0, 1, 2].forEach(i => {                                         // your brand (index 2) draws last, on top while it passes
      const p = pop(t, L + .12 + i * .08), y = y0 + slot[i] * rh, me = i === 2, on = me ? clamp(up) : 0;
      g.save(); g.globalAlpha = clamp(p * 3); g.translate(0, (1 - p) * 14 * U);
      g.fillStyle = mixOklab(P.paper2, P.signal, on); rrect(rx + 70 * U, y, rw - 70 * U, rh - 12 * U, 14 * U); g.fill();
      txt(d.items[i], rx + 98 * U, y + (rh - 12 * U) / 2, 'sans', 32 * U, me ? mixOklab(P.inkText, P.paper, on) : P.muted, { w: me ? 700 : 500 });
      if (me && on > .05) txt('↑', rx + rw - 40 * U, y + (rh - 12 * U) / 2, 'sans', 34 * U, P.paper, { w: 700, align: 'center' });
      g.restore();
    });
    const ca = spring(t - L - 1.2, 220, 24);
    if (ca > .01) { g.save(); g.globalAlpha = clamp(ca); txt(d.caption, vx + VW / 2, y0 + 3 * rh + 30 * U, 'mono', 24 * U, P.muted, { w: 500, align: 'center' }); g.restore(); }
  },
};
function levGeom() {
  const Ns = fit(LV.map(l => l.name), 'sans', 150 * U, BOX.w * .86, 800);
  const nameY = CY - (FMT === 'portrait' ? 170 : 105) * U, railY = nameY - Ns * .78 - 46 * U;
  return { Ns, nameY, railY, vy: nameY + Ns * .5 + 20 * U, VW: Math.min(BOX.w * .94, 1000 * U) };
}
function actLevers(t, top) {
  const G = levGeom(), k = Math.max(0, LT.filter(x => t >= x).length - 1);
  g.save(); g.translate(0, top);
  // rail: 01–06, the cobalt dot stretches from number to number
  const sp = 74 * U, rx0 = CX - sp * (LV.length - 1) / 2, ra = pop(t, A.wipe + .25);
  LV.forEach((_, i) => {
    const on = clamp(spring(t - LT[i], 300, 26) - (i + 1 < LT.length ? spring(t - LT[i + 1], 300, 26) : 0));
    g.save(); g.globalAlpha = clamp(ra * 3); txt(String(i + 1).padStart(2, '0'), rx0 + i * sp, G.railY, 'mono', 26 * U, mixOklab('#6B6E68', P.inkText, on), { w: 500, align: 'center' }); g.restore();
  });
  if (t >= LT[0] - .3) {
    const stops = [[0, rx0 - sp * .6], ...LT.map((tt, i) => [tt, rx0 + i * sp])];
    const lead = track(t, stops, 320, 30), trail = track(t, stops, 140, 22), r = 6 * U * pop(t, LT[0] - .3);
    g.fillStyle = P.signal; rrect(Math.min(lead, trail) - r, G.railY + 26 * U - r, Math.abs(lead - trail) + 2 * r, 2 * r, r); g.fill();
  }
  // lever name rolls in on each change
  roll(LV.map((l, i) => [LT[i], l.name]), t, CX, G.nameY, G.Ns, (it, x, y, a) => {
    g.save(); g.globalAlpha *= a; txt(it[1], x, y, 'sans', G.Ns, P.inkText, { w: 800, align: 'center' }); g.restore();
  }, 1.18);
  // its visual: in after the name lands, out (blurred, on the layer) before the next one
  for (const j of [k - 1, k]) {
    if (j < 0 || t < LT[j]) continue;
    const out = clamp((t - (lvEnd(j) - .28)) / .2);
    if (out >= 1 && j + 1 < LT.length) continue;
    const draw_ = () => VIS[LV[j].kind](t, LT[j], LV[j], CX - G.VW / 2, G.vy, G.VW);
    if (out <= 0 || j + 1 >= LT.length) { g.save(); draw_(); g.restore(); }
    else withLayer(1 - out, 10 * U * out, () => { g.translate(0, top - out * 24 * U); draw_(); });
  }
  g.restore();
}

// ================================================================ ACT 5 · end card (15.0 – 18.0)
function endGeom() {
  const us = fit([C.url], 'sans', 92 * U, BOX.w * .9, 700), uy = CY - 50 * U;
  const bs = 32 * U, bh = 80 * U, pad = 40 * U, gap = 20 * U;
  const w1 = tw(C.cta1, 'sans', bs, 600) + pad * 2, w2 = tw(C.cta2, 'sans', bs, 600) + pad * 2;
  const by = CY + 80 * U, bx = CX - (w1 + gap + w2) / 2;
  return { us, uy, bs, bh, w1, w2, by, b1: bx, b2: bx + w1 + gap };
}
function act5(t) {
  const G = endGeom();
  // URL opens from the dot outward
  const op = E.outCubic(clamp((t - A.url) / .45)), uw = tw(C.url, 'sans', G.us, 700);
  if (op > 0) withLayer(1, 8 * U * (1 - op), () => clipRect(CX - uw / 2 * op - 4, G.uy - G.us, uw * op + 8, G.us * 2, () => txt(C.url, CX, G.uy, 'sans', G.us, P.onDark, { w: 700, align: 'center' })));
  // the dot: pops after the iris, waits in the URL's centre, drops to the first button and becomes it
  const pop = spring(t - A.iris - .2, 300, 18), dropP = spring(t - A.url - .3, 240, 24), m = spring(t - A.buttons, 220, 22);
  const press = spring(t - A.click, 600, 30) - spring(t - A.click - .1, 400, 28);
  const c1x = G.b1 + G.w1 / 2, c1y = G.by + G.bh / 2;
  const dxx = lerp(CX, c1x, dropP), dyy = lerp(G.uy, c1y, dropP);
  if (m < .02) dot(dxx, dyy, 7 * U * pop * (1 - .3 * op * (1 - dropP)), P.signalOnDark);
  else {
    const w = lerp(14 * U, G.w1, m), h = lerp(14 * U, G.bh, m), sc = 1 - .05 * press;
    g.save(); g.translate(c1x, c1y); g.scale(sc, sc);
    g.fillStyle = mixOklab(P.signalOnDark, P.signal, clamp(m)); rrect(-w / 2, -h / 2, w, h, h / 2); g.fill();
    const ta = clamp((t - A.buttons - .12) / .15); if (ta > 0) { g.globalAlpha = ta; txt(C.cta1, 0, 1 * U, 'sans', G.bs, P.paper, { w: 600, align: 'center' }); }
    g.restore();
  }
  // second button: outline, after the first
  const b2 = spring(t - A.buttons - .12, 240, 22);
  if (b2 > .01) {
    g.save(); g.globalAlpha = clamp(b2); g.translate(G.b2 + G.w2 / 2, G.by + G.bh / 2 + (1 - b2) * 16 * U);
    g.strokeStyle = 'rgba(236,238,242,.35)'; g.lineWidth = 2 * U; rrect(-G.w2 / 2, -G.bh / 2, G.w2, G.bh, G.bh / 2); g.stroke();
    txt(C.cta2, 0, 1 * U, 'sans', G.bs, P.onDark, { w: 600, align: 'center' }); g.restore();
  }
  // cursor: enters from the lower right, clicks the call button on the beat
  const ca = clamp((t - A.cursorIn) / .2); if (ca <= 0) return;
  const sx = CX + 430 * U, sy = CY + 330 * U, ex = c1x + G.w1 * .18, ey = c1y + G.bh * .12;
  const kx = track(t, [[0, sx], [A.cursorIn + .05, ex]], 110, 20), ky = track(t, [[0, sy], [A.cursorIn + .05, ey]], 110, 20);
  g.save(); g.globalAlpha = ca; g.translate(kx, ky); const cs = 1.7 * U * (1 - .15 * press); g.scale(cs, cs);
  g.fillStyle = '#fff'; g.strokeStyle = '#111'; g.lineWidth = 1.6; g.lineJoin = 'round';
  const ar = new Path2D('M0 0 L0 22 L6 16.5 L10.5 26 L14 24.5 L9.6 15.4 L17 15.4 Z'); g.fill(ar); g.stroke(ar); g.restore();
}

// ================================================================ draw(t): the only entry point
function draw(T) {
  const t = Math.min(T, DUR - 1e-4);
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.filter = 'none';
  const wipeP = E.inOutCubic(clamp((t - A.wipe) / .32)), panelTop = H * (1 - wipeP);
  if (t < A.wipe + .4) {                                            // dark acts (pushed up as the paper arrives)
    g.fillStyle = P.ink; g.fillRect(0, 0, W, H); vignette(true);
    if (t < A.tagline + .02) act1(t);
    else act2(t);
  }
  if (t >= A.wipe && t < A.iris + .6) {                             // the paper panel and everything on it
    g.save(); g.beginPath(); g.rect(0, panelTop, W, H - panelTop); g.clip();
    g.fillStyle = P.paper; g.fillRect(0, 0, W, H); vignette(false);
    const tp = clamp((t - A.leversOut) / .42), tpe = inCubic(tp);
    if (tp <= 0) actLevers(t, panelTop);
    else withLayer(1 - tp * tp, 18 * U * tpe, () => {              // the proof tilts away into the dot
      g.translate(CX, CY); g.rotate(-.42 * tpe); g.scale(1 - .88 * tpe, 1 - .88 * tpe); g.translate(-CX, -CY); actLevers(t, 0);
    });
    // the ink dot that the proof collapses into, then grows into the iris
    if (t >= A.leversOut) {
      const R = 8 * U * spring(t - A.leversOut - .1, 300, 20) + spring(t - A.iris + .15, 70, 14) * Math.hypot(W, H) * .6;
      const fe = Math.max(2, R * .09), gr = g.createRadialGradient(CX, CY, Math.max(0, R - fe), CX, CY, R + fe);
      gr.addColorStop(0, P.ink); gr.addColorStop(1, 'rgba(12,13,16,0)'); g.fillStyle = gr; g.beginPath(); g.arc(CX, CY, R + fe, 0, Math.PI * 2); g.fill();
    }
    g.restore();
  }
  if (t >= A.iris + .6) { g.fillStyle = P.ink; g.fillRect(0, 0, W, H); vignette(true); }
  if (t >= A.iris) act5(t);
}
window.draw = window.seek = draw;

// ---------------------------------------------------------------- frame composer: average N subframes (motion blur)
const acc = document.createElement('canvas'); acc.width = W; acc.height = H; const ag = acc.getContext('2d');
window.renderFrame = (i, opts = {}) => {
  const times = subframeTimes(i, { fps: TL.fps || 60, sub: 6, shutter: .75, fast: TL.fast || [], hardCuts: TL.hardCuts || [], dur: DUR, ...opts });
  times.forEach((ts, k) => { draw(ts); ag.globalAlpha = 1 / (k + 1); ag.drawImage(cv, 0, 0); });
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.filter = 'none'; g.drawImage(acc, 0, 0);
};
(async () => {
  for (const f of window.FONTS || []) { const ff = new FontFace(f.family, `url(data:font/woff2;base64,${f.b64})`, { weight: f.weight || '400', style: f.style || 'normal' }); await ff.load(); document.fonts.add(ff); }
  await Promise.all(Object.entries(TL.images || {}).map(([k, src]) => load(k, src)));
  draw(0); window.ready = true;
})();
</script></body></html>
