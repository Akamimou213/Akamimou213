<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script>
// Get Regular, 30 s. An illustrated story film with the reference's grammar (one action per shot, hard cuts, lines
// centred under the picture) in Get Regular's own look: near-black with moss glows, cream paper, clay accents, Inter Tight.
// Maya and the doctor are drawn in code from the first film's character designs (docs/style_guide.md).
// Contract (motion-reel): render.cjs injects window.TL / Motion / FONTS; URL ?size=WxH; pure draw(t); renderFrame(i).
// Everything is a function of t: seeded textures are built once at load, nothing is carried between frames.
// Coordinates: design units, 1080 wide (U px each); DH = frame height in design units. Shots compose around FY.
const { clamp, lerp, E, spring, track } = window.Motion;
const Q = new URLSearchParams(location.search);
const [W, H] = (Q.get('size') || '1080x1920').split('x').map(Number);
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const g = cv.getContext('2d');
const TL = window.TL, SC = TL.scenes, DUR = TL.duration, P = TL.palette, C = TL.copy.en;
const CAPS = Q.get('captions') === '0' ? [] : TL.captions;
const U = W / 1080, DH = H / U, TALL = DH >= 1700;
const K = TALL ? 1 : DH / 1920 * 1.22;                             // shrink the illustration in shorter formats
const FY = DH * (TALL ? .43 : .39);                                // focal line, above the caption rail
const FLOOR = DH * (TALL ? .70 : .72);                             // where rooms meet the floor; lines sit below it
const SAFE = TALL ? { l: .08, r: .12, t: .12, b: .18 } : { l: .07, r: .07, t: .08, b: .1 };
window.SAFEBOX = { x0: W * SAFE.l, y0: H * SAFE.t, x1: W * (1 - SAFE.r), y1: H * (1 - SAFE.b) };
const CUTS = SC.map(s => s.t).filter(t => t > 0);

// ---------------------------------------------------------------- deterministic noise
const fract = x => x - Math.floor(x);
const hash = (i, j = 0, s = 0) => fract(Math.sin(i * 127.1 + j * 311.7 + s * 74.7) * 43758.5453);
const sm = x => x * x * (3 - 2 * x);
function vn(x, y, px, py, s) {                                     // periodic value noise (period px, py lattice cells)
  const ix = Math.floor(x), iy = Math.floor(y), fx = sm(x - ix), fy = sm(y - iy);
  const h = (a, b) => hash(((a % px) + px) % px, ((b % py) + py) % py, s);
  return lerp(lerp(h(ix, iy), h(ix + 1, iy), fx), lerp(h(ix, iy + 1), h(ix + 1, iy + 1), fx), fy);
}
const n1 = (x, s = 0) => { const i = Math.floor(x); return lerp(hash(i, 7, s), hash(i + 1, 7, s), sm(x - i)); };

// ---------------------------------------------------------------- painted textures, one tile per colour
const rgbOf = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
const TEX = {};
function makeTex(key, hex, seed, amt = .08) {
  const N = 512, c = document.createElement('canvas'); c.width = c.height = N;
  const x = c.getContext('2d'), im = x.createImageData(N, N), d = im.data, [r, gg, b] = rgbOf(hex);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const m = .5 * vn(i / 64, j / 64, 8, 8, seed) + .3 * vn(i / 16, j / 16, 32, 32, seed + 1) + .2 * vn(i / 4, j / 4, 128, 128, seed + 2);
    const st = vn(i / 3, j / 64, 171, 8, seed + 3) * .6 + vn(i / 8, j / 128, 64, 4, seed + 4) * .4;   // dry-brush streaks
    let k = 1 + amt * ((m - .5) * 1.6 + (st - .5) * 1.4);
    if (hash(i, j, seed + 9) < .004) k *= .85;
    const o = (j * N + i) * 4; d[o] = clamp(r * k, 0, 255); d[o + 1] = clamp(gg * k, 0, 255); d[o + 2] = clamp(b * k, 0, 255); d[o + 3] = 255;
  }
  x.putImageData(im, 0, 0); TEX[key] = g.createPattern(c, 'repeat');
}
let GRAIN;
function makeGrain() {                                             // static film grain, soft-lit over every frame
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d'), im = x.createImageData(W, H), d = im.data;
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    const v = 128 + 34 * (hash(i, j, 3) - .5) + 14 * (vn(i / 3 / U, j / 3 / U, 1e6, 1e6, 5) - .5), o = (j * W + i) * 4;
    d[o] = d[o + 1] = d[o + 2] = v; d[o + 3] = 255;
  }
  x.putImageData(im, 0, 0); GRAIN = c;
}
const T = k => TEX[k] || P[k] || k;

// ---------------------------------------------------------------- shapes with painted edges
function roughRect(x, y, w, h, seed, amp = 4, r = 6) {
  const p = new Path2D(), per = 2 * (w + h), n = Math.max(24, Math.round(per / 14));
  for (let k = 0; k <= n; k++) {
    const s = k / n * per; let px, py, nx, ny;
    if (s < w) { px = x + s; py = y; nx = 0; ny = -1; }
    else if (s < w + h) { px = x + w; py = y + s - w; nx = 1; ny = 0; }
    else if (s < 2 * w + h) { px = x + w - (s - w - h); py = y + h; nx = 0; ny = 1; }
    else { px = x; py = y + h - (s - 2 * w - h); nx = -1; ny = 0; }
    const o = (n1(s / 40, seed) - .5) * 2 * amp + (hash(k, 1, seed) - .5) * amp * .5;
    k ? p.lineTo(px + nx * o, py + ny * o) : p.moveTo(px + nx * o, py + ny * o);
  }
  p.closePath(); return p;
}
function blob(cx, cy, r, seed, amp = .12, n = 28, ry = r) {
  const p = new Path2D();
  for (let k = 0; k <= n; k++) {
    const a = k / n * Math.PI * 2, f = 1 + (n1(k * .7, seed) - .5) * 2 * amp;
    k ? p.lineTo(cx + Math.cos(a) * r * f, cy + Math.sin(a) * ry * f) : p.moveTo(cx + Math.cos(a) * r * f, cy + Math.sin(a) * ry * f);
  }
  p.closePath(); return p;
}
const fill = (path, k) => { g.fillStyle = T(k); g.fill(path); };
const ell = (x, y, rx, ry, rot = 0) => { const p = new Path2D(); p.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); return p; };
function around(x, y, s, fn) { g.save(); g.translate(x, y); g.scale(s, s); fn(); g.restore(); }
const cam = (lt, d, a = 1, b = 1.05) => lerp(a, b, E.inOutCubic(clamp(lt / d)));

// ---------------------------------------------------------------- grounds: the site's dark with moss glows, or cream paper
function groundDark(t, seed = 0) {
  g.fillStyle = T('ink'); g.fillRect(0, 0, 1080, DH);
  g.save(); g.globalCompositeOperation = 'screen';
  [[260, .22, 520, 'rgba(105,125,65,.55)'], [860, .62, 600, 'rgba(85,95,45,.5)'], [540, .95, 520, 'rgba(70,85,40,.4)']].forEach(([x, fy, r, c], k) => {
    const cx = x + 70 * Math.sin(t * .25 + k * 2 + seed), cy = DH * fy + 60 * Math.cos(t * .2 + k + seed);
    const gr = g.createRadialGradient(cx, cy, 0, cx, cy, r); gr.addColorStop(0, c); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 1080, DH);
  });
  g.restore();
}
function groundCream() { g.fillStyle = T('cream'); g.fillRect(0, 0, 1080, DH); }
function room(t, x0 = 540) {                                       // the doctor's office: an arch, a plant, the floor
  groundCream();
  fill(roughRect(0, FLOOR, 1080, DH - FLOOR, 301, 3), 'sand');
  const aw = 380, ah = 760 * K, ax = x0 - aw / 2, ay = FLOOR - ah;
  const arch = new Path2D(); arch.moveTo(ax, FLOOR); arch.lineTo(ax, ay + aw / 2); arch.arc(x0, ay + aw / 2, aw / 2, Math.PI, 0); arch.lineTo(ax + aw, FLOOR); arch.closePath();
  fill(arch, 'sandDeep');
  g.save(); g.clip(arch); g.globalAlpha = .5; fill(blob(x0 + 60, ay + 300, 260, 302, .1), 'sage'); g.restore();
  around(950, FLOOR, K, () => {                                    // plant: clay pot, moss leaves that sway
    for (let k = 0; k < 7; k++) {
      const a = -1.9 + k * .27 + .04 * Math.sin(t * 1.3 + k), len = 170 + 60 * hash(k, 4);
      g.save(); g.translate(0, -120); g.rotate(a + Math.PI / 2); fill(ell(0, -len / 2, 26, len / 2), k % 2 ? 'moss' : 'mossDeep'); g.restore();
    }
    fill(roughRect(-62, -130, 124, 130, 303, 3), 'clay');
  });
}

// ---------------------------------------------------------------- type (the site's Inter Tight, light, italic accents)
const FAM = 'Inter Tight';
const font = (size, weight = 300, italic = false, fam = FAM) => { g.font = `${italic ? 'italic ' : ''}${weight} ${size}px "${fam}", sans-serif`; };
function lines(s, size, maxW) {                                    // one line if it fits, else the most balanced two
  font(size); const ws = s.split(' '), L = (a, b) => g.measureText(ws.slice(a, b).join(' ')).width;
  if (L(0, ws.length) <= maxW) return [s];
  let best = null; for (let k = 1; k < ws.length; k++) { const m = Math.max(L(0, k), L(k, ws.length)); if (m <= maxW && (!best || m < best[0])) best = [m, k]; }
  return best ? [ws.slice(0, best[1]).join(' '), ws.slice(best[1]).join(' ')] : [s];
}
function drawCaption(t, s) {
  const c = CAPS.find(c => t >= c.t0 && t < c.t1); if (!c) return;
  const maxW = (1 - SAFE.l - SAFE.r) * 1080 - 20; let size = 62;
  let L = lines(c.text, size, maxW); while (L.length > 2 || L.some(l => { font(size); return g.measureText(l).width > maxW; })) { size *= .95; L = lines(c.text, size, maxW); }
  const cx = 1080 * (SAFE.l + (1 - SAFE.l - SAFE.r) / 2), lh = size * 1.18, y0 = Math.min(s.capY * DH, DH * (1 - SAFE.b) - lh * L.length / 2 - 10) - (L.length - 1) * lh / 2;
  g.save(); font(size); g.textAlign = 'center'; g.textBaseline = 'middle';
  L.forEach((l, i) => {
    if (s.cap === 'light') { g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 18; g.shadowOffsetY = 2; g.fillStyle = P.white; }
    else { g.shadowColor = 'transparent'; g.fillStyle = P.ink; }
    g.fillText(l, cx, y0 + i * lh);
  });
  g.restore();
}

// ---------------------------------------------------------------- characters (designs from the first film)
// Origin at mid-chest; the head is centred at (0, -360). pose: { mood: worried|blank|calm|smile|listen, hand: pockets|belly|clipboard|report,
// look: -1..1 (eyes and head turn), t0: scene start for the reaction }. Life: blinks and breath, all from t.
const MAYA = { hair: 'hairDark', hairLen: 1, outer: 'ochre', outerShade: 'ochreDeep', top: 'white', legs: 'black', glasses: false, steth: false, seed: 1 };
const DOC = { hair: 'silver', hairLen: .45, outer: 'coat', outerShade: 'coatShade', top: 'sage', legs: 'tan', glasses: true, steth: true, seed: 2 };
function backHair(sp) {
  const p = new Path2D(), bot = -360 + 112 * sp.hairLen + 20, rx = sp.hairLen > .6 ? 120 : 98;
  p.moveTo(-rx, -372); p.bezierCurveTo(-rx, -470, -60, -500, 0, -500); p.bezierCurveTo(60, -500, rx + 4, -470, rx, -372);
  p.bezierCurveTo(rx + 8, -330, rx + 14, bot - 40, rx + 4, bot);
  const sc = 5; for (let k = 1; k <= sc; k++) { const x0 = rx + 4 - (2 * rx + 8) * (k - 1) / sc, x1 = rx + 4 - (2 * rx + 8) * k / sc; p.quadraticCurveTo((x0 + x1) / 2, bot + (k % 2 ? 22 : 8), x1, bot + (k === sc ? 0 : 6)); }
  p.bezierCurveTo(-rx - 14, bot - 40, -rx - 8, -330, -rx, -372); p.closePath(); return p;
}
function frontHair(sp) {
  const p = new Path2D();
  p.moveTo(-84, -330); p.bezierCurveTo(-92, -430, -50, -470, 6, -468); p.bezierCurveTo(60, -466, 94, -430, 86, -340);
  p.bezierCurveTo(76, -390, 52, -420, 14, -428);                    // side part: the fringe sweeps from the right
  p.bezierCurveTo(-30, -420, -66, -395, -84, -330); p.closePath();
  if (sp.hairLen > .6) {                                           // locks that frame the face
    p.moveTo(-86, -400); p.bezierCurveTo(-104, -350, -104, -290, -92, -244); p.lineTo(-70, -250); p.bezierCurveTo(-76, -300, -74, -350, -66, -392); p.closePath();
    p.moveTo(84, -390); p.bezierCurveTo(104, -340, 106, -286, 96, -246); p.lineTo(74, -252); p.bezierCurveTo(80, -300, 76, -350, 66, -384); p.closePath();
  }
  return p;
}
const TORSO = (() => {
  const p = new Path2D(); p.moveTo(-58, -232);
  p.bezierCurveTo(-140, -222, -205, -205, -226, -158); p.bezierCurveTo(-246, -116, -250, -40, -248, 60); p.lineTo(-252, 320);
  p.lineTo(252, 320); p.lineTo(248, 60); p.bezierCurveTo(250, -40, 246, -116, 226, -158); p.bezierCurveTo(205, -205, 140, -222, 58, -232); p.closePath(); return p;
})();
function face(sp, pose, t) {
  const m = pose.mood, lx = (pose.look || 0) * 12, rt = t - (pose.t0 || 0);
  const blink = m !== 'calm' && fract(t / 3.3 + sp.seed * .37) < .045;
  g.save(); g.translate(lx, 0); g.lineCap = g.lineJoin = 'round';
  g.fillStyle = 'rgba(190,90,60,.22)'; g.fill(ell(-44, -326, 18, 12)); g.fill(ell(44, -326, 18, 12));   // cheeks
  g.strokeStyle = P.ink; g.fillStyle = P.ink;
  const eye = x => {
    if (m === 'calm') { g.lineWidth = 4.5; g.beginPath(); g.moveTo(x - 12, -358); g.quadraticCurveTo(x, -368, x + 12, -358); g.stroke(); return; }
    if (blink) { g.lineWidth = 4; g.beginPath(); g.moveTo(x - 10, -360); g.lineTo(x + 10, -360); g.stroke(); return; }
    const wide = m === 'blank' ? 1 + .35 * spring(rt - .1, 200, 18) : 1;
    if (m === 'blank') { g.fillStyle = P.white; g.fill(ell(x, -360, 12 * wide, 13 * wide)); g.fillStyle = P.ink; g.fill(ell(x, -360, 5.5, 6)); g.lineWidth = 3; g.stroke(ell(x, -360, 12 * wide, 13 * wide)); }
    else g.fill(ell(x, -360, 7.5, 9.5));
  };
  eye(-30); eye(30);
  g.lineWidth = 4.5;                                               // brows carry most of the feeling
  const brow = (s) => {
    const inner = { worried: -398, blank: -404, calm: -390, smile: -392, listen: -392 }[m], outer = { worried: -388, blank: -400, calm: -392, smile: -394, listen: -390 }[m];
    g.beginPath(); g.moveTo(s * 16, inner); g.quadraticCurveTo(s * 32, Math.min(inner, outer) - 5, s * 46, outer); g.stroke();
  };
  brow(-1); brow(1);
  g.strokeStyle = 'rgba(120,60,40,.55)'; g.lineWidth = 3.5; g.beginPath(); g.moveTo(4, -352); g.quadraticCurveTo(10, -330, 0, -326); g.stroke();   // nose
  g.strokeStyle = '#8A3B2A'; g.fillStyle = '#8A3B2A'; g.lineWidth = 4.5; g.beginPath();
  if (m === 'worried') { g.moveTo(-13, -298); g.quadraticCurveTo(0, -306, 13, -298); g.stroke(); }
  else if (m === 'blank') { g.fill(ell(0, -300, 7, 9)); }
  else if (m === 'listen') { g.moveTo(-10, -302); g.lineTo(10, -302); g.stroke(); }
  else { g.moveTo(-17, -305); g.quadraticCurveTo(0, -290, 17, -305); g.stroke(); }
  if (sp.glasses) { g.strokeStyle = P.ink; g.lineWidth = 3.5; g.stroke(ell(-30, -360, 24, 21)); g.stroke(ell(30, -360, 24, 21)); g.beginPath(); g.moveTo(-6, -362); g.quadraticCurveTo(0, -368, 6, -362); g.stroke(); }
  g.restore();
}
function hand(x, y, rot, s = 1) {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s);
  fill(blob(0, 0, 46, 401, .06, 20, 34), 'skin');
  g.strokeStyle = 'rgba(150,80,55,.4)'; g.lineWidth = 3; for (let k = -1; k <= 1; k++) { g.beginPath(); g.moveTo(10 + k * 2, k * 13); g.lineTo(38, k * 12); g.stroke(); }
  g.restore();
}
function person(sp, pose, t, under) {
  const breath = 1 + .008 * Math.sin(t * 2.1 + sp.seed);
  g.save(); g.scale(1, breath);
  fill(backHair(sp), sp.hair);
  fill(roughRect(-30, -300, 60, 90, 410 + sp.seed, 1.5), 'skinShade');               // neck
  fill(TORSO, sp.outer);
  if (pose.hand === 'pockets' || pose.hand === 'belly' || !pose.hand) {
    fill(roughRect(-200, 270, 400, 60, 420 + sp.seed, 2), sp.legs);                   // trousers under the open front
  }
  const front = new Path2D(); front.moveTo(-60, -232); front.lineTo(60, -232); front.bezierCurveTo(52, -60, 52, 120, 46, 320); front.lineTo(-46, 320); front.bezierCurveTo(-52, 120, -52, -60, -60, -232); front.closePath();
  fill(front, sp.top);
  fill(roughRect(-200, 250, 400, 70, 430 + sp.seed, 2), sp.legs);
  fill(blob(0, -236, 50, 440, .04, 20, 26), 'skin');                                  // neckline
  g.save(); g.globalAlpha = .55; g.strokeStyle = T(sp.outerShade); g.lineWidth = 10; g.lineCap = 'round';   // arm creases and the open front
  g.beginPath(); g.moveTo(-178, -118); g.lineTo(-192, 300); g.moveTo(178, -118); g.lineTo(192, 300);
  g.moveTo(-60, -232); g.bezierCurveTo(-52, -60, -52, 120, -46, 320); g.moveTo(60, -232); g.bezierCurveTo(52, -60, 52, 120, 46, 320); g.stroke(); g.restore();
  if (sp.steth) {
    g.save(); g.strokeStyle = P.ink; g.lineWidth = 7; g.lineCap = 'round'; g.beginPath(); g.moveTo(-44, -228); g.bezierCurveTo(-90, -120, -60, -40, -10, -30); g.moveTo(44, -228); g.bezierCurveTo(70, -150, 60, -100, 40, -70); g.stroke();
    fill(ell(-10, -26, 16, 16), 'silver'); g.restore();
  }
  fill(ell(-76, -352, 12, 18), 'skinShade'); fill(ell(76, -352, 12, 18), 'skinShade');   // ears
  fill(ell(0, -360, 76, 94), 'skin');
  fill(frontHair(sp), sp.hair);
  face(sp, pose, t);
  if (under) under();
  if (pose.hand === 'belly') {                                     // a hand over her stomach, sleeve bent across
    g.save(); g.strokeStyle = T(sp.outer); g.lineCap = g.lineJoin = 'round'; g.lineWidth = 86;
    g.beginPath(); g.moveTo(-196, -110); g.lineTo(-198, 70); g.lineTo(-40, 120); g.stroke();
    g.strokeStyle = T(sp.outerShade); g.lineWidth = 8; g.globalAlpha = .5; g.beginPath(); g.moveTo(-232, 80); g.quadraticCurveTo(-200, 160, -130, 160); g.stroke(); g.restore();
    hand(-2, 116, -.15);
  }
  if (pose.hand === 'clipboard' || pose.hand === 'report') {        // both forearms up, holding a page at the chest
    g.save(); g.strokeStyle = T(sp.outer); g.lineCap = g.lineJoin = 'round'; g.lineWidth = 80;
    g.beginPath(); g.moveTo(-196, -110); g.lineTo(-200, 90); g.lineTo(-120, 60); g.moveTo(196, -110); g.lineTo(200, 90); g.lineTo(120, 60); g.stroke(); g.restore();
    g.save(); g.translate(0, 10); g.rotate(pose.hand === 'report' ? -.06 : .05);
    if (pose.hand === 'clipboard') { fill(roughRect(-110, -110, 220, 280, 450, 2), 'mossDeep'); fill(roughRect(-94, -90, 188, 244, 451, 2), 'white'); fill(roughRect(-36, -122, 72, 26, 452, 1), 'ink');
      g.fillStyle = 'rgba(14,12,8,.45)'; for (let k = 0; k < 4; k++) g.fill(roughRect(-70, -60 + k * 46, 90 + 40 * hash(k, 2), 8, 453 + k, 1)); }
    else miniReport(220);
    g.restore();
    hand(-118, 70, -.4, .9); hand(118, 70, Math.PI + .4, .9);
  }
  g.restore();
}
function miniReport(w) {                                           // the page Maya brings: a chart and three lines
  const h = w * 1.3; fill(roughRect(-w / 2, -h / 2, w, h, 460, 2), 'white'); fill(roughRect(-w / 2, -h / 2, w, h * .12, 461, 2), 'moss');
  for (let k = 0; k < 6; k++) { const hh = h * (.08 + .18 * hash(k, 5)); fill(roughRect(-w * .36 + k * w * .12, -h * .02 - hh, w * .08, hh, 462 + k, 1), k % 3 === 1 ? 'clay' : 'mossDeep'); }
  g.fillStyle = 'rgba(14,12,8,.4)'; for (let k = 0; k < 3; k++) g.fill(roughRect(-w * .36, h * .1 + k * h * .1, w * .6, 6, 470 + k, 1));
}

// ---------------------------------------------------------------- the gut line (the brand's "your gut is talking", drawn)
const GUT = (() => {
  const pts = [], add = (x, y) => pts.push([x, y]);
  for (let y = 240; y >= -40; y -= 10) add(-122, y);
  for (let a = Math.PI; a <= Math.PI * 1.5; a += .2) add(-92 + 30 * Math.cos(a), -40 + 30 * Math.sin(a));
  for (let x = -92; x <= 92; x += 10) add(x, -70);
  for (let a = Math.PI * 1.5; a <= Math.PI * 2; a += .2) add(92 + 30 * Math.cos(a), -40 + 30 * Math.sin(a));
  for (let y = -40; y <= 150; y += 10) add(122, y);
  let dir = -1;
  for (let row = 0; row < 5; row++) {
    const y = 150 - row * 44, x0 = dir < 0 ? 84 : -84, x1 = -x0;
    for (let k = 0; k <= 16; k++) add(lerp(x0, x1, k / 16), y);
    if (row < 4) for (let a = 0; a <= Math.PI; a += .26) add(x1 + dir * 22 * Math.sin(a), y - 22 + 22 * Math.cos(a));
    dir = -dir;
  }
  return pts;
})();
function gutPath(t, knot) {
  const p = new Path2D();
  GUT.forEach(([x, y], i) => {
