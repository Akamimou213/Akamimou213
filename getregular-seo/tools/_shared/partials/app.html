<section class="app sec photo no-print" style="--bg:url(../_shared/img/{{img}}.jpg)" aria-labelledby="appH">
  <div class="wrap app-grid">
    <div>
      <p class="label"><b>{{label}}</b></p>
      <h2 class="h2" id="appH">{{title_s}}<span class="t">{{title_t}}</span></h2>
      <p class="sub">{{sub}}</p>
      <div class="store-row">
        <a class="btn btn-white js-appstore" data-ct="{{ct}}" data-cpp="{{cpp}}" href="#"><svg class="apple" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.37 1.43c0 1.14-.42 2.2-1.1 2.98-.82.95-2.04 1.6-3.07 1.52-.13-1.1.42-2.26 1.1-3 .77-.85 2.08-1.5 3.07-1.5zM20.5 17.3c-.55 1.27-.82 1.84-1.53 2.97-1 1.56-2.4 3.5-4.13 3.51-1.54.02-1.94-1-4.03-.99-2.09.01-2.53 1.01-4.07.99-1.73-.02-3.06-1.77-4.06-3.33C-.12 16.1-.42 11 1.33 8.3c1.24-1.93 3.2-3.05 5.04-3.05 1.87 0 3.05 1.02 4.6 1.02 1.5 0 2.42-1.02 4.58-1.02 1.64 0 3.38.9 4.62 2.44-4.06 2.22-3.4 8.02.33 9.6z"/></svg>Download on the App Store</a>
        <span class="muted small">Free for iPhone &amp; iPad</span>
      </div>
    </div>
    <div class="app-visual">
      <img class="phone" src="https://www.getregular.com/images/home.png" alt="The Get Regular app's Today screen with Gut Health, Regular and Nutrition scores" width="300" height="618" loading="lazy">
      <div class="glass-solid">
        <p class="h3" style="margin-bottom:18px">Try This</p>
        <div class="glass-row"><span>{{try}}</span><span class="status-pill">Active</span></div>
        <div class="circles" style="margin:20px 0 14px" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <p class="muted small" style="margin:0">{{caption}}</p>
      </div>
    </div>
  </div>
</section>
