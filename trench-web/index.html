<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trench</title>
<meta name="color-scheme" content="dark">
<script src="/static/lightweight-charts.js"></script>
<style>
:root{--bg:#0d1014;--panel:#13171c;--line:#1f252c;--txt:#d6dde4;--dim:#7d8894;--faint:#4b545e;--up:#2fbf71;--down:#f0564a;--acc:#4c8dff;--warn:#d9a441;
  font:13px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:var(--bg)}
*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}.up{color:var(--up)}.down{color:var(--down)}.dim{color:var(--dim)}.faint{color:var(--faint)}
header{display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header b.logo{letter-spacing:.08em}
#search{flex:0 1 380px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
#feeds{display:flex;gap:10px;margin-left:auto;color:var(--dim);font-size:12px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--faint);margin-right:4px;vertical-align:1px}
.dot.live{background:var(--up)}.dot.err{background:var(--down)}.dot.wait{background:var(--warn)}
main{display:grid;grid-template-columns:minmax(380px,430px) 1fr 330px;min-height:0}
section{min-height:0;border-right:1px solid var(--line);display:flex;flex-direction:column}
/* list */
.tabs{display:flex;gap:2px;padding:8px 8px 0;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:5px 8px;border-radius:5px;color:var(--dim)}
.tabs button[aria-pressed=true]{background:var(--line);color:var(--txt)}
.tabs .sort{margin-left:auto}
#list{overflow:auto;flex:1;padding:6px 0}
.row{display:grid;grid-template-columns:14px 1fr 54px 62px 64px 46px;gap:6px;align-items:center;padding:6px 10px;border-left:2px solid transparent;cursor:pointer}
.row:hover{background:#161b21}.row.sel{background:#18202a;border-left-color:var(--acc)}
.row .sym{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right}
.row .qb{border:1px solid var(--line);background:none;border-radius:4px;padding:2px 0;font-size:11px;color:var(--dim)}
.row .qb.ok{border-color:#2a5a3f;color:var(--up)}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sdot.pass{background:var(--up)}.sdot.dead{background:var(--down)}.sdot.unknown{background:var(--warn)}.sdot.run{background:var(--faint);animation:p 1s infinite}
@keyframes p{50%{opacity:.3}}
.empty{padding:30px 16px;color:var(--dim);text-align:center}
/* coin */
#coin{overflow:auto}
.chead{padding:12px 14px 8px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;border-bottom:1px solid var(--line)}
.chead h1{margin:0;font-size:20px}
.chead .ca{color:var(--dim);font-size:12px;background:none;border:1px solid var(--line);border-radius:4px;padding:2px 6px}
.links{display:flex;gap:10px;font-size:12px}.links a{color:var(--dim);text-decoration:none}.links a:hover{color:var(--txt)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.stats div{background:var(--bg);padding:8px 12px}.stats span{display:block;font-size:11px;color:var(--dim)}.stats b{font-size:14px;font-weight:600}
.tfs{display:flex;gap:2px;padding:6px 10px}.tfs button{background:none;border:0;color:var(--dim);padding:3px 8px;border-radius:4px}.tfs button[aria-pressed=true]{background:var(--line);color:var(--txt)}
.tfs .st{margin-left:auto;color:var(--faint);font-size:12px}
#chart{height:330px;margin:0 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line)}
.two>div{padding:10px 14px;min-width:0}.two>div+div{border-left:1px solid var(--line)}
h3{margin:0 0 8px;font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
table{width:100%;border-collapse:collapse;table-layout:fixed}td{padding:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}td.r{text-align:right}
.checks td:nth-child(2){width:48%}.checks td.r{padding-left:8px}
#c-trades{max-height:300px;overflow:auto}
.callbox{padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--dim);white-space:pre-wrap;max-height:120px;overflow:auto}
/* ticket */
#ticket{border-right:0;overflow:auto;padding:12px 14px;gap:12px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.plans button{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;text-align:left;font-size:12px}
.plans button b{display:block;font-size:13px}.plans button span{color:var(--dim)}
.plans button[aria-pressed=true]{border-color:var(--acc);background:#14202f}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}.kv span{color:var(--dim)}.kv b{text-align:right;font-weight:600}
#buy{background:var(--acc);border:0;border-radius:7px;padding:12px;font-size:15px;font-weight:700;color:#fff}
#buy:disabled{background:var(--line);color:var(--dim);cursor:not-allowed}
.msg{min-height:18px;font-size:12px;color:var(--dim)}.msg.err{color:var(--down)}.msg.ok{color:var(--up)}
.jup{display:block;text-align:center;border:1px solid var(--line);border-radius:7px;padding:9px;color:var(--txt);text-decoration:none}
.checks td:first-child{width:18px}.ok-i{color:var(--up)}.bad-i{color:var(--down)}
.keys{font-size:11px;color:var(--faint)}
kbd{border:1px solid var(--line);border-radius:3px;padding:0 4px;font:11px ui-monospace,monospace;color:var(--dim)}
/* book */
footer{border-top:1px solid var(--line);background:var(--panel);max-height:34vh;display:flex;flex-direction:column}
.bsum{display:flex;gap:18px;align-items:center;padding:7px 14px;flex-wrap:wrap}
.bsum b{font-weight:600}.bsum .sp{margin-left:auto;display:flex;gap:8px}
.bsum button{background:none;border:1px solid var(--line);border-radius:5px;padding:3px 9px;color:var(--dim)}
#pos{overflow:auto;padding:0 14px 8px}
#pos td,#pos th{padding:4px 8px 4px 0;text-align:left;font-weight:400}#pos th{color:var(--dim);font-size:11px}
#pos .sell{background:none;border:1px solid #5a2a2a;color:var(--down);border-radius:4px;padding:1px 8px}
@media (max-width:1100px){main{grid-template-columns:minmax(320px,380px) 1fr}#ticket{grid-column:1/-1;border-top:1px solid var(--line)}body{overflow:auto;height:auto}main{min-height:auto}#list{max-height:70vh}}
@media (max-width:720px){main{grid-template-columns:1fr}.two{grid-template-columns:1fr}.two>div+div{border-left:0;border-top:1px solid var(--line)}#feeds{display:none}}
</style>
</head>
<body>
<header>
  <b class="logo">TRENCH</b>
  <input id="search" placeholder="Paste a contract address  ( / )" autocomplete="off" spellcheck="false">
  <div id="feeds"></div>
</header>
<main>
  <section>
    <div class="tabs" id="tabs"></div>
    <div id="list"></div>
  </section>
  <section id="coin"><div class="empty">Pick a coin. New pump.fun launches stream in on the left as they happen.</div></section>
  <section id="ticket"></section>
</main>
<footer>
  <div class="bsum" id="bsum"></div>
  <div id="pos"></div>
</footer>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const usd = (x, d) => { if (x == null || !isFinite(x)) return "–"; const a = Math.abs(x), s = x < 0 ? "-" : "";
  if (a >= 1e9) return s + "$" + (a / 1e9).toFixed(2) + "B"; if (a >= 1e6) return s + "$" + (a / 1e6).toFixed(2) + "M";
  if (a >= 1e3) return s + "$" + (a / 1e3).toFixed(a >= 1e5 ? 0 : 1) + "K"; return s + "$" + a.toFixed(d ?? (a >= 10 ? 0 : 2)); };
const px = (p) => { if (!p || !isFinite(p)) return "–"; if (p >= 1) return "$" + p.toFixed(4); const z = Math.floor(-Math.log10(p)); return "$" + p.toFixed(Math.min(12, z + 4)); };
// 0.0000070 -> 0.0₅70 (zeros as a subscript, like trading screens), so tiny prices fit the axis
const SUB = "₀₁₂₃₄₅₆₇₈₉";
const tinyPx = (p) => { if (!p || !isFinite(p)) return ""; if (p >= 0.001) return p >= 1 ? p.toFixed(4) : p.toFixed(5);
  const z = Math.floor(-Math.log10(p)), digits = Math.round(p * Math.pow(10, z + 3)); return "0.0" + String(z).split("").map((d) => SUB[d]).join("") + String(digits).replace(/0+$/, ""); };
const pc = (x, d = 0) => (x == null || !isFinite(x) ? "–" : (x > 0 ? "+" : "") + x.toFixed(d) + "%");
const cl = (x) => (x == null ? "" : x > 0 ? "up" : x < 0 ? "down" : "");
const now = () => Date.now() / 1000;
const ago = (ts) => { if (!ts) return "–"; const s = Math.max(0, now() - ts); return s < 60 ? Math.floor(s) + "s" : s < 3600 ? Math.floor(s / 60) + "m" : s < 86400 ? (s / 3600).toFixed(s < 36000 ? 1 : 0) + "h" : Math.floor(s / 86400) + "d"; };
const short = (a) => (a ? a.slice(0, 4) + "…" + a.slice(-4) : "");
const MINT = /^[1-9A-HJ-NP-Za-km-z]{32,44}$/;
const DS = "https://api.dexscreener.com", GT = "https://api.geckoterminal.com/api/v2";
// GeckoTerminal allows ~30 calls a minute per address; after a refusal, rest it for a minute
let geckoRestUntil = 0;
const geckoOk = () => Date.now() > geckoRestUntil;
const geckoFail = () => { geckoRestUntil = Date.now() + 60000; feeds.gecko = "err"; };
async function getJSON(url, ms = 12000) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error("HTTP " + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}

// ================================================================ rules (same numbers as the desk's config.json)
const RULES = { start: 1000, riskPct: 1, maxPct: 0.08, maxPoolPct: 0.02, feeSide: 0.0225, maxOpen: 5, cooldownMin: 30, noReentryH: 24, dailyStopPct: -5 };
const PLANS = {
  fresh: { name: "Fresh", sub: "2x · −50% · 60m", sl: 0.5, tp: 2.0, partial: null, arm: null, trail: null, tmax: 60 },
  call: { name: "Call", sub: "2x · −50% · 24h", sl: 0.5, tp: 2.0, partial: null, arm: null, trail: null, tmax: 24 * 60 },
  momentum: { name: "Momentum", sub: "−6% · trail 6% after +12%", sl: 0.06, tp: null, partial: null, arm: 0.12, trail: 0.06, tmax: 60 },
  runner: { name: "Runner", sub: "½ at 2x · trail 25% · −40%", sl: 0.4, tp: 2.0, partial: 0.5, arm: 1.0, trail: 0.25, tmax: 24 * 60 },
};
// exit engine: the same rules as exits.py (stop first inside a bar, trail from earlier peaks only)
function exitBar(pos, t, o, h, l, c) {
  const p = PLANS[pos.plan], fills = [];
  if (pos.left <= 1e-9) return fills;
  const sell = (frac, price, why) => { frac = Math.min(frac, pos.left); pos.left = +(pos.left - frac).toFixed(9); fills.push({ frac, price, why }); };
  if (l <= pos.stop) { sell(pos.left, Math.min(o, pos.stop), pos.armed ? "trailing stop" : "stop"); return fills; }
  if (p.tp && h >= pos.entry * p.tp && !pos.tookProfit) { pos.tookProfit = true; sell(p.partial || 1, pos.entry * p.tp, "take profit"); if (pos.left <= 1e-9) return fills; }
  if (p.arm != null && h >= pos.entry * (1 + p.arm)) pos.armed = true;
  pos.peak = Math.max(pos.peak, h);
  if (pos.armed) pos.stop = Math.max(pos.stop, pos.peak * (1 - p.trail));
  if (t - pos.entryTs >= p.tmax * 60) sell(pos.left, c, "time stop");
  return fills;
}

// ================================================================ the paper book (kept in this browser)
const BOOK_KEY = "trench-book-v1";
let book;
function loadBook() {
  try { book = JSON.parse(localStorage.getItem(BOOK_KEY)); } catch (e) { book = null; }
  if (!book || typeof book.cash !== "number") book = { cash: RULES.start, open: [], closed: [], nextId: 1 };
}
function saveBook() { try { localStorage.setItem(BOOK_KEY, JSON.stringify(book)); } catch (e) {} }
loadBook();
const equity = () => book.cash + book.open.reduce((a, p) => a + p.size * p.left * (p.last || p.entry) / p.entry, 0);
function settle(pos, fills, liq) {
  for (const f of fills) {
    const notional = pos.size * f.frac * f.price / pos.entry;
    const impact = liq ? Math.min(notional / liq, 1) : 0;
    const got = notional * (1 - impact) * (1 - RULES.feeSide);
    book.cash += got; pos.proceeds = (pos.proceeds || 0) + got; pos.lastWhy = f.why; pos.exitPx = f.price;
  }
  if (pos.left <= 1e-9) {
    book.open = book.open.filter((p) => p.id !== pos.id);
    const pnl = pos.proceeds - pos.cost;
    book.closed.unshift({ id: pos.id, mint: pos.mint, symbol: pos.symbol, plan: pos.plan, ret: pnl / pos.cost, pnl, why: pos.lastWhy, exitTs: pos.lastTs || now() });
    book.closed = book.closed.slice(0, 200);
  }
}
function blockedByBook(mint) {
  if (book.open.some((p) => p.mint === mint)) return "already holding it: no averaging down";
  if (book.open.length >= RULES.maxOpen) return `${RULES.maxOpen} positions open`;
  const t = now(), lost = book.closed.find((c) => c.pnl < 0);
  if (lost && t - lost.exitTs < RULES.cooldownMin * 60) return `cooldown after a loss: ${Math.ceil(RULES.cooldownMin - (t - lost.exitTs) / 60)} min`;
  const again = book.closed.find((c) => c.mint === mint && c.pnl < 0 && t - c.exitTs < RULES.noReentryH * 3600);
  if (again) return `lost on this coin ${ago(again.exitTs)} ago: no re-entry for ${RULES.noReentryH} h`;
  const day0 = t - (t % 86400), today = book.closed.filter((c) => c.exitTs >= day0).reduce((a, c) => a + c.pnl, 0);
  if (today / RULES.start * 100 <= RULES.dailyStopPct) return "daily loss stop hit";
  return null;
}
function sizeFor(plan, liq) {
  const frac = Math.min(RULES.maxPct, RULES.riskPct / 100 / (PLANS[plan].sl + 2 * RULES.feeSide));
  return Math.max(0, Math.min(equity() * frac, (liq || 0) * RULES.maxPoolPct, book.cash));
}

// ================================================================ coins
// one record per mint, filled from whichever feed sees it first
const coins = new Map();
let SOL = null;
const feeds = { launches: "wait", dexscreener: "wait", gecko: "wait", safety: "wait", calls: "wait" };
function coin(mint) {
  let c = coins.get(mint);
  if (!c) { c = { mint, src: {}, trades: [], buyers: new Set(), buys: 0, sells: 0 }; coins.set(mint, c); }
  return c;
}
// live price, market cap and pool size, from our own trade stream when it is fresh, else DexScreener
function live(c) {
  const t = c.trades[c.trades.length - 1];
  if (t && SOL && (!c.dsTs || t.t >= c.dsTs - 5)) {
    const pool = c.vSol && !c.graduated ? 2 * c.vSol * SOL : c.liq;
    return { price: t.price, mcap: t.mcapSol ? t.mcapSol * SOL : c.mcap, liq: pool, ts: t.t, from: "trades" };
  }
  return { price: c.price, mcap: c.mcap, liq: c.liq ?? curveLiq(c), ts: c.dsTs, from: "dexscreener" };
}
// pump.fun curve: virtual reserves start at 30 SOL x 1.073B tokens, so mcap in SOL = vSol^2 / 32.19
function curveLiq(c) {
  if (!SOL || !c.mcap || c.graduated || !(c.onCurve || (c.src.launch && !c.pair) || c.dex === "pumpfun")) return null;
  const vSol = Math.sqrt(c.mcap / SOL * 32.19); return 2 * vSol * SOL;
}
function window5(c) {
  const t0 = now() - 300; let vol = 0, b = 0, s = 0, first = null;
  for (let i = c.trades.length - 1; i >= 0; i--) { const x = c.trades[i]; if (x.t < t0) break; vol += x.usd; x.buy ? b++ : s++; first = x; }
  return { vol, b, s, first };
}
function heat(c) {
  if (c.wsSince && now() - c.wsSince > 30) { const w = window5(c); return w.vol; }
  return c.vol5 || 0;
}
function chg5(c) {
  if (c.wsSince && now() - c.wsSince > 60) { const w = window5(c), l = live(c); return w.first && l.price ? (l.price / w.first.price - 1) * 100 : 0; }
  return c.chg5;
}
function addTrade(c, m) {
  if (!SOL) return;
  const tok = +(m.tokenAmount || m.initialBuy) || 0, sol = +m.solAmount || 0, buy = m.txType === "buy" || m.txType === "create";
  // on the curve the spot price is vSol / vTokens; on a pool, the fill price
  const price = (m.vSolInBondingCurve && m.vTokensInBondingCurve ? m.vSolInBondingCurve / m.vTokensInBondingCurve : tok ? sol / tok : 0) * SOL;
  if (!isFinite(price) || price <= 0) return;
  c.trades.push({ t: now(), buy, sol, usd: sol * SOL, price, mcapSol: m.marketCapSol, who: m.traderPublicKey });
  if (c.trades.length > 4000) c.trades.splice(0, 1000);
  buy ? c.buys++ : c.sells++;
  if (m.traderPublicKey) c.buyers.add(m.traderPublicKey);
  if (m.vSolInBondingCurve) c.vSol = m.vSolInBondingCurve;
  if (m.marketCapSol) c.mcap = m.marketCapSol * SOL;
  c.price = price;
  if (c.mint === sel) { liveCandle(c, price); dirtyCoin = true; }
  dirtyList = true;
  for (const p of book.open) if (p.mint === c.mint) tickPos(p, price, live(c).liq);
}

// ================================================================ PumpPortal: launches, graduations, trades (one websocket, straight from the browser)
// per-coin trade streams need a funded PumpPortal API key (not used here); launches and graduations are free
let ws = null, wsKeys = new Set(), wsBackoff = 1, tradeStream = false;
function connectWS() {
  feeds.launches = "wait";
  ws = new WebSocket("wss://pumpportal.fun/api/data");
  ws.onopen = () => {
    wsBackoff = 1; feeds.launches = "live"; wsKeys = new Set();
    ws.send(JSON.stringify({ method: "subscribeNewToken" }));
    ws.send(JSON.stringify({ method: "subscribeMigration" }));
    syncKeys();
  };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch (x) { return; }
    if (m && m.message && /API key/i.test(m.message)) { tradeStream = false; return; }
    if (!m || m.message || !m.mint) return;
    const c = coin(m.mint);
    if (m.txType === "create") {
      c.sym = m.symbol; c.name = m.name; c.born = now(); c.src.launch = now(); if (tradeStream) c.wsSince = now();
      c.devPct = m.initialBuy ? m.initialBuy / 1e9 * 100 : 0; c.dev = m.traderPublicKey; c.pool = m.pool;
      addTrade(c, m); if (tradeStream) subscribe([m.mint]); needDs.add(m.mint); trimLaunches();
    } else if (m.txType === "migrate") {
      c.src.grad = now(); c.graduated = true; if (!c.sym) needDs.add(m.mint); queueCheck(m.mint, 2);
    } else if (m.txType === "buy" || m.txType === "sell") {
      addTrade(c, m);
    }
    dirtyList = true;
  };
  ws.onclose = () => { feeds.launches = "err"; setTimeout(connectWS, Math.min(30, wsBackoff *= 2) * 1000); };
  ws.onerror = () => { try { ws.close(); } catch (x) {} };
}
function subscribe(keys) {
  keys = keys.filter((k) => !wsKeys.has(k)); if (!keys.length || !ws || ws.readyState !== 1) return;
  keys.forEach((k) => wsKeys.add(k)); ws.send(JSON.stringify({ method: "subscribeTokenTrade", keys }));
}
function unsubscribe(keys) {
  keys = keys.filter((k) => wsKeys.has(k)); if (!keys.length || !ws || ws.readyState !== 1) return;
  keys.forEach((k) => wsKeys.delete(k)); ws.send(JSON.stringify({ method: "unsubscribeTokenTrade", keys }));
}
// follow trades for: launches under 20 minutes old (newest 80), the selected coin, open positions
function syncKeys() {
  if (!tradeStream) return;
  const t = now(), want = new Set();
  [...coins.values()].filter((c) => c.src.launch && t - c.src.launch < 1200).sort((a, b) => b.src.launch - a.src.launch).slice(0, 80).forEach((c) => want.add(c.mint));
  if (sel) want.add(sel); book.open.forEach((p) => want.add(p.mint));
  subscribe([...want]); unsubscribe([...wsKeys].filter((k) => !want.has(k)));
  for (const k of want) { const c = coins.get(k); if (c && !c.wsSince) c.wsSince = t; }
  for (const c of coins.values()) if (c.wsSince && !want.has(c.mint)) c.wsSince = null;
}
// launches that went nowhere after 20 minutes are dropped so the list stays short
function trimLaunches() {
  const t = now();
  for (const [k, c] of coins) {
    if (k === sel || book.open.some((p) => p.mint === k)) continue;
    const only = Object.keys(c.src).length === 1 && c.src.launch;
    if (only && t - c.src.launch > 1200 && (c.mcap || 0) < 30000) coins.delete(k);
  }
}

// ================================================================ DexScreener / GeckoTerminal, straight from the browser
const needDs = new Set();
function mergeDs(pairs) {
  const by = {};
  for (const p of pairs || []) {
    if (p.chainId !== "solana" || !p.baseToken) continue;
    const m = p.baseToken.address; if (!coins.has(m)) continue;

  else $("c-safety").innerHTML = `<table class="checks">${k.checks.map((x) => `<tr><td class="${x.ok ? "ok-i" : "bad-i"}">${x.ok ? "✓" : "✗"}</td><td>${esc(x.label)}</td><td class="r dim">${esc(x.value)}</td></tr>`).join("")}</table><div class="faint" style="margin-top:6px">checked ${ago(k.ts)} ago</div>`;
  $("c-holders").innerHTML = k && k.top_holders ? (k.top_holders.length ? `<table>${k.top_holders.map((h) => `<tr><td><a class="dim" style="text-decoration:none" target="_blank" rel="noopener" href="https://solscan.io/account/${esc(h.owner)}">${short(h.owner)}</a>${h.owner === c.dev ? ' <span class="faint">dev</span>' : ""}</td><td class="r num">${h.pct != null ? h.pct.toFixed(2) + "%" : "–"}</td></tr>`).join("")}</table>` : `<div class="dim">none listed</div>`) : `<div class="dim">${k && !k.run ? "unavailable" : "Checking…"}</div>`;
  // trades: ours from the websocket, else GeckoTerminal's
  const tr = c.wsSince && c.trades.length ? c.trades.slice(-30).reverse() : geckoTrades;
  $("c-trades").innerHTML = tr.length ? `<table>${tr.slice(0, 30).map((t) => `<tr><td class="${t.buy ? "up" : "down"}">${t.buy ? "buy" : "sell"}</td><td class="num">${usd(t.usd, t.usd < 10 ? 2 : 0)}</td><td class="dim">${short(t.who)}</td><td class="r faint num">${ago(t.t)}</td></tr>`).join("")}</table>` : `<div class="dim">${tradesSt || "no trades yet"}</div>`;
  const cb = $("c-call");
  if (c.call) { cb.hidden = false; cb.textContent = `${c.call.channel} · ${ago(c.call.ts)} ago\n\n${c.call.text}`; } else cb.hidden = true;
  paintTicket();
}

// ================================================================ ticket
function paintTicketShell() {
  $("ticket").innerHTML = `
    <div><h3>Exit plan</h3><div class="plans" id="t-plans"></div></div>
    <div class="kv" id="t-kv"></div>
    <button id="buy">Paper buy</button>
    <div class="msg" id="t-msg"></div>
    <a class="jup" id="t-jup" target="_blank" rel="noopener">Real trade: open Jupiter ↗</a>
    <div class="keys"><kbd>↑</kbd><kbd>↓</kbd> move · <kbd>B</kbd> buy · <kbd>S</kbd> sell · <kbd>C</kbd> copy address · <kbd>/</kbd> search</div>`;
  $("t-plans").onclick = (e) => { const b = e.target.closest("[data-plan]"); if (!b) return; plan = b.dataset.plan; paintTicket(); };
  $("buy").onclick = () => buy(sel, plan);
}
function buyBlock(m, l, size) {
  const k = checks[m];
  if (!k || k.run) return "safety check running…";
  if (k.safety === "dead") return "safety: " + (k.safety_why || "failed");
  if (k.safety !== "pass") return k.safety_why || "safety check could not run";
  return blockedByBook(m) || (!l.price ? "no live price" : !l.ts || now() - l.ts > 30 ? "price is stale" : size < 5 ? "size under $5 (pool too thin)" : null);
}
function paintTicket() {
  const c = coins.get(sel); if (!c || !$("t-plans")) return;
  $("t-plans").innerHTML = Object.entries(PLANS).map(([k, t]) => `<button data-plan="${k}" aria-pressed="${k === plan}"><b>${t.name}</b><span>${t.sub}</span></button>`).join("");
  const t = PLANS[plan], l = live(c), size = sizeFor(plan, l.liq), p = l.price;
  $("t-kv").innerHTML = [["Size", usd(size, 2)], ["Entry ≈", px(p)], ["Target", t.tp ? px(p * t.tp) : "trailing"], ["Stop", p ? px(p * (1 - t.sl)) : "–"],
    ["Loss if stopped", usd(-size * (t.sl + 2 * RULES.feeSide), 2)], ["Time limit", t.tmax >= 120 ? t.tmax / 60 + "h" : t.tmax + "m"]].map(([a, b]) => `<span>${a}</span><b class="num">${b}</b>`).join("");
  const why = buyBlock(c.mint, l, size);
  $("buy").disabled = !!why; $("buy").textContent = why ? "Paper buy" : `Paper buy ${usd(size, 0)}`;
  const msg = $("t-msg"); if (!msg.dataset.keep) { msg.className = "msg" + (why && !why.endsWith("…") ? " err" : ""); msg.textContent = why || ""; }
  $("t-jup").href = `https://jup.ag/swap/SOL-${c.mint}`;
}
async function buy(m, pl) {
  const c = coins.get(m); if (!c) return;
  const msg = $("t-msg"), say = (t, k) => { if (!msg) return; msg.className = "msg " + (k || ""); msg.textContent = t; msg.dataset.keep = "1"; clearTimeout(say.t); say.t = setTimeout(() => { delete msg.dataset.keep; dirtyCoin = true; }, 4000); };
  if (!checkFresh(m)) { say("Re-checking safety…"); await runCheck(m); }
  if (Date.now() / 1000 - (live(c).ts || 0) > 10 && c.pair) await dsBatch([m]);
  const l = live(c), size = sizeFor(pl, l.liq), why = buyBlock(m, l, size);
  if (why) { say(why, "err"); return; }
  const fill = l.price * (1 + (l.liq ? size / l.liq : 0)), P = PLANS[pl];
  book.cash -= size;
  book.open.push({ id: book.nextId++, mint: m, symbol: c.sym || short(m), plan: pl, entryTs: now(), lastTs: now(), entry: fill, size: size * (1 - RULES.feeSide), cost: size,
    liq: l.liq, last: fill, peak: fill, stop: fill * (1 - P.sl), armed: false, left: 1, proceeds: 0, tookProfit: false });
  saveBook(); syncKeys(); drawLines(); dirtyBook = dirtyList = true;
  say(`Filled ${usd(size, 2)} at ${px(fill)} · ${P.name}`, "ok");
}

// ================================================================ positions
function tickPos(pos, price, liq) {
  const t = now(); pos.last = price; pos.lastTs = t;
  if (pos.liq && liq != null && liq < pos.liq * 0.5) { pos.left = pos.left; const f = [{ frac: pos.left, price, why: "liquidity pulled" }]; pos.left = 0; settle(pos, f, liq); }
  else settle(pos, exitBar(pos, t, price, price, price, price), liq);
  dirtyBook = true; if (pos.mint === sel) drawLines();
}
function sellAll(id) {
  const pos = book.open.find((p) => p.id === id); if (!pos) return;
  const c = coins.get(pos.mint), l = c ? live(c) : {}, price = l.price || pos.last;
  const f = [{ frac: pos.left, price, why: "sold by hand" }]; pos.left = 0; pos.lastTs = now(); settle(pos, f, l.liq || pos.liq);
  saveBook(); syncKeys(); drawLines(); dirtyBook = true;
}
let showJournal = false;
function paintBook() {
  const t = now(), day0 = t - (t % 86400), today = book.closed.filter((c) => c.exitTs >= day0).reduce((a, c) => a + c.pnl, 0);
  const wins = book.closed.filter((c) => c.pnl > 0).length;
  $("bsum").innerHTML = `<span class="dim">Paper</span> <span>Equity <b class="num">${usd(equity(), 2)}</b></span><span>Cash <b class="num">${usd(book.cash, 2)}</b></span>
    <span>Today <b class="num ${cl(today)}">${usd(today, 2)}</b></span><span>Open <b>${book.open.length}/${RULES.maxOpen}</b></span>
    <span>Closed <b>${book.closed.length}</b> <span class="dim">${book.closed.length ? Math.round(wins / book.closed.length * 100) + "% won" : ""}</span></span>
    <span class="sp"><button id="b-j">${showJournal ? "Positions" : "Journal"}</button><button id="b-r">Reset</button></span>`;
  $("b-j").onclick = () => { showJournal = !showJournal; dirtyBook = true; };
  $("b-r").onclick = (e) => { if (e.target.dataset.sure) { book = { cash: RULES.start, open: [], closed: [], nextId: 1 }; saveBook(); syncKeys(); dirtyBook = true; } else { e.target.dataset.sure = "1"; e.target.textContent = "Reset? click again"; setTimeout(() => { dirtyBook = true; }, 3000); } };
  if (showJournal) {
    $("pos").innerHTML = book.closed.length ? `<table><tr><th>Coin</th><th>Plan</th><th>Result</th><th>P&L</th><th>Exit</th><th>When</th></tr>${book.closed.slice(0, 60).map((c) => `<tr><td><a href="#" data-sel="${c.mint}" style="color:inherit">${esc(c.symbol)}</a></td><td class="dim">${PLANS[c.plan]?.name || c.plan}</td><td class="num ${cl(c.ret)}">${pc(c.ret * 100, 1)}</td><td class="num ${cl(c.pnl)}">${usd(c.pnl, 2)}</td><td class="dim">${esc(c.why)}</td><td class="faint">${ago(c.exitTs)} ago</td></tr>`).join("")}</table>` : `<div class="dim" style="padding:4px 0 8px">No closed trades yet.</div>`;
  } else {
    $("pos").innerHTML = book.open.length ? `<table><tr><th>Coin</th><th>Plan</th><th>Size</th><th>Entry</th><th>Now</th><th>Return</th><th>Stop</th><th>Time left</th><th></th></tr>${book.open.map((p) => {
      const r = (p.last / p.entry) * (1 - RULES.feeSide) * (1 - RULES.feeSide) - 1, left = PLANS[p.plan].tmax * 60 - (t - p.entryTs);
      return `<tr><td><a href="#" data-sel="${p.mint}" style="color:inherit">${esc(p.symbol)}</a></td><td class="dim">${PLANS[p.plan].name}${p.armed ? " · trailing" : ""}</td><td class="num">${usd(p.cost * p.left, 2)}</td><td class="num">${px(p.entry)}</td><td class="num">${px(p.last)}</td>
        <td class="num ${cl(r)}">${pc(r * 100, 1)}</td><td class="num dim">${px(p.stop)}</td><td class="num dim">${left > 0 ? (left >= 3600 ? (left / 3600).toFixed(1) + "h" : Math.ceil(left / 60) + "m") : "now"}</td><td><button class="sell" data-sell="${p.id}">Sell</button></td></tr>`;
    }).join("")}</table>` : `<div class="dim" style="padding:4px 0 8px">No open positions.</div>`;
  }
}
$("pos").addEventListener("click", (e) => {
  const s = e.target.closest("[data-sell]"); if (s) { sellAll(+s.dataset.sell); return; }
  const a = e.target.closest("[data-sel]"); if (a) { e.preventDefault(); select(a.dataset.sel); }
});
// the page was closed: replay each open position on the 1-minute candles it missed
async function catchUp() {
  for (const pos of [...book.open]) {
    if (now() - (pos.lastTs || pos.entryTs) < 120) continue;
    try {
      const d = await (await fetch(`/api/history?mint=${pos.mint}&since=${Math.floor(pos.lastTs || pos.entryTs)}`)).json();
      for (const b of d.candles || []) {
        if (b[0] < (pos.lastTs || pos.entryTs) - 60) continue;
        const hi = Math.max(b[1], b[4]), lo = Math.max(b[3], Math.min(b[1], b[4]) * 0.5);
        const fills = exitBar(pos, b[0] + 60, b[1], hi, lo, b[4]);
        pos.last = b[4]; pos.lastTs = b[0] + 60;
        if (fills.length) settle(pos, fills, pos.liq);
        if (!book.open.includes(pos)) break;
      }
    } catch (e) {}
  }
  saveBook(); dirtyBook = true;
}

// ================================================================ header, search, keys
function paintFeeds() {
  const n = { launches: "Launches", dexscreener: "DexScreener", gecko: "GeckoTerminal", safety: "Safety", calls: "Calls" };
  $("feeds").innerHTML = Object.entries(n).map(([k, l]) => `<span><i class="dot ${feeds[k]}"></i>${l}</span>`).join("") + `<span class="num">SOL ${SOL ? "$" + SOL.toFixed(2) : "–"}</span>`;
}
$("search").addEventListener("input", (e) => {
  const v = e.target.value.trim(); const m = (v.match(/[1-9A-HJ-NP-Za-km-z]{32,44}/) || [])[0];
  if (m) { select(m); e.target.value = ""; e.target.blur(); }
});
function copyCA() { if (!sel) return; navigator.clipboard?.writeText(sel).then(() => { const b = $("c-ca"); if (b) { b.textContent = "copied"; setTimeout(() => { b.textContent = short(sel) + " ⧉"; }, 1200); } }).catch(() => {}); }
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") { if (e.key === "Escape") e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const i = visible.findIndex((c) => c.mint === sel);
  if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); const n = visible[Math.min(visible.length - 1, i + 1)]; if (n) select(n.mint); }
  else if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); const n = visible[Math.max(0, i - 1)]; if (n) select(n.mint); }
  else if (e.key === "b" && sel) buy(sel, plan);
  else if (e.key === "s" && sel) { const p = book.open.find((x) => x.mint === sel); if (p) sellAll(p.id); }
  else if (e.key === "c") copyCA();
  else if (e.key === "/") { e.preventDefault(); $("search").focus(); }
});

// ================================================================ loops
function frame() {
  if (dirtyList) { dirtyList = false; paintTabs(); paintList(); }
  if (dirtyCoin) { dirtyCoin = false; paintCoin(); }
  if (dirtyBook) { dirtyBook = false; paintBook(); }
  requestAnimationFrame(frame);
}
setInterval(() => { dirtyList = true; dirtyCoin = true; paintFeeds(); }, 1000);
setInterval(refresh, 3000);
setInterval(syncKeys, 10000);
setInterval(trimLaunches, 60000);
setInterval(autoChecks, 4000);
setInterval(discover, 30000);
setInterval(pollCalls, 60000);
setInterval(solPrice, 60000);
setInterval(() => { const c = coins.get(sel); if (c && c.pair && !c.wsSince) loadTrades(c); }, 15000);
(async () => {
  paintFeeds(); paintBook(); requestAnimationFrame(frame);
  await solPrice(); connectWS();
  for (const p of book.open) { const c = coin(p.mint); c.sym = c.sym || p.symbol; c.src.held = p.entryTs; }
  let s = null; try { s = localStorage.getItem("trench-sel"); } catch (e) {}
  if (s) select(s);
  discover(); pollCalls(); catchUp(); refresh();
})();
</script>
